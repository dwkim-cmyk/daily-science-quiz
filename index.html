<title>하루 한 조각 · 과학과 일본어</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ground: #E9EDE3;
    --paper: #F5F7EF;
    --ink: #1B322B;
    --ink-soft: #4A5D53;
    --accent: #1F7A4D;        /* 과학 = 에메랄드 */
    --accent-deep: #163B29;
    --clay: #B25534;          /* 일본어 = 클레이 */
    --clay-deep: #8A3F26;
    --line: rgba(27, 50, 43, 0.10);
    --grid: rgba(27, 50, 43, 0.045);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    --jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", var(--sans);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--ground);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 500px; margin: 0 auto; padding: 0 18px 52px; }

  header {
    background: var(--accent-deep);
    color: var(--paper);
    margin: 0 -18px;
    padding: 26px 22px 22px;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em;
    text-transform: uppercase; color: rgba(245,247,239,0.6);
    margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .eyebrow .day { color: var(--paper); font-size: 13px; letter-spacing: 0.14em; }
  header h1.brand { margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -0.01em; }
  header .date { font-family: var(--mono); font-size: 13px; color: rgba(245,247,239,0.68); margin-top: 6px; }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; margin: 18px 0 8px;
  }
  .stat { background: var(--paper); padding: 12px 8px 11px; text-align: center; }
  .stat .num { font-family: var(--mono); font-size: 21px; font-weight: 600; color: var(--accent); line-height: 1.1; }
  .stat .lab { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

  .seclabel {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-soft); margin: 28px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .seclabel::before { content: ""; width: 16px; height: 2px; background: currentColor; opacity: 0.5; }

  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 18px; padding: 24px 22px 22px;
  }
  .card.jp { border-color: rgba(178,85,52,0.28); }

  .tag {
    display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    color: var(--accent); background: rgba(31,122,77,0.10); border: 1px solid rgba(31,122,77,0.22);
    padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
  }
  .tag.clay { color: var(--clay-deep); background: rgba(178,85,52,0.10); border-color: rgba(178,85,52,0.26); }

  .fact-title { font-size: 22px; font-weight: 750; line-height: 1.35; margin: 0 0 14px; letter-spacing: -0.01em; }
  .fact-body p { font-size: 16px; color: #263a32; margin: 0 0 13px; }
  .fact-body p:last-child { margin-bottom: 0; }

  .think {
    margin-top: 18px; padding: 13px 15px; background: rgba(31,122,77,0.07);
    border-radius: 12px; font-size: 14.5px; color: #2c4a3c;
  }
  .think b { color: var(--accent); font-weight: 700; }

  .jp-word { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .jp-word .kanji { font-family: var(--jp); font-size: 40px; font-weight: 700; line-height: 1.1; }
  .jp-word .read { font-family: var(--jp); font-size: 16px; color: var(--clay-deep); }
  .jp-word .mean { font-size: 17px; color: var(--ink-soft); }

  .jp-block { margin-top: 18px; }
  .jp-block h4 {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--clay-deep); margin: 0 0 9px; font-weight: 600;
  }
  .hanja { font-size: 15px; color: #3a4a42; }
  .hanja .arrow { display: block; margin-top: 4px; color: var(--ink-soft); }

  .forms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .forms li { font-size: 14.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .forms .k { font-family: var(--jp); font-weight: 600; }
  .forms .r { font-family: var(--jp); font-size: 12.5px; color: var(--clay-deep); }
  .forms .m { color: var(--ink-soft); }
  .forms .role { font-size: 11px; color: var(--ink-soft); font-family: var(--mono); min-width: 62px; }

  .sents { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
  .sents li { position: relative; padding-left: 26px; }
  .sents li::before {
    counter-increment: s; content: counter(s); position: absolute; left: 0; top: 1px;
    font-family: var(--mono); font-size: 11px; color: #fff; background: var(--clay);
    width: 18px; height: 18px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  }
  .sents .jpt { font-family: var(--jp); font-size: 16px; font-weight: 500; display: block; }
  .sents .rdt { font-family: var(--jp); font-size: 13px; color: var(--clay-deep); display: block; margin-top: 2px; }
  .sents .kot { font-size: 14px; color: var(--ink-soft); display: block; margin-top: 3px; }

  .readbtn {
    margin-top: 20px; width: 100%; font-family: var(--sans); font-size: 15px; font-weight: 600;
    background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
    border-radius: 12px; padding: 12px; cursor: pointer; transition: background .15s, color .15s;
  }
  .readbtn:hover { background: rgba(31,122,77,0.08); }
  .readbtn.done { background: var(--accent); color: #fff; }
  .card.jp .readbtn { color: var(--clay-deep); border-color: var(--clay); }
  .card.jp .readbtn:hover { background: rgba(178,85,52,0.08); }
  .card.jp .readbtn.done { background: var(--clay); color: #fff; }

  .alldone { margin: 24px 0 0; text-align: center; font-size: 14.5px; color: var(--ink-soft); display: none; }
  .alldone.show { display: block; animation: rise .4s ease both; }
  .alldone b { color: var(--accent); }
  @keyframes rise { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce) { .alldone.show { animation: none; } .readbtn { transition: none; } }

  .empty {
    background: var(--paper); border: 1px dashed var(--line); border-radius: 18px;
    padding: 40px 24px; text-align: center; color: var(--ink-soft);
  }
  .testbar {
    margin-top: 28px; border-top: 1px dashed var(--line); padding-top: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .testbar .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); opacity: 0.7; }
  .testbar button { font-family: var(--mono); font-size: 12px; background: transparent; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .testbar button:hover { border-color: var(--accent); color: var(--accent); }
  .testbar button:disabled { opacity: 0.35; cursor: default; }
</style>

<div class="app">
  <header>
    <p class="eyebrow"><span>오늘의 한 조각</span><span class="day" id="dayLabel">DAY 001</span></p>
    <h1 class="brand">하루 한 조각</h1>
    <div class="date" id="dateLabel">—</div>
  </header>

  <section class="stats">
    <div class="stat"><div class="num" id="stStreak">0</div><div class="lab">연속일</div></div>
    <div class="stat"><div class="num" id="stSci">0</div><div class="lab">읽은 과학</div></div>
    <div class="stat"><div class="num" id="stJp">0</div><div class="lab">배운 단어</div></div>
  </section>

  <main id="stage"></main>
  <div class="alldone" id="allDone">오늘 몫을 다 읽었어요 · <b>내일 또 만나요</b></div>

  <div class="testbar">
    <span class="lbl">테스트용 · 다른 날 미리보기</span>
    <span>
      <button id="prevBtn">◀ 이전</button>
      <button id="nextBtn">다음 ▶</button>
    </span>
  </div>
</div>

<script>
/* ================= 콘텐츠 재고 ================= */
const SCI = [
  { field:"지구과학", title:"왜 눈송이는 육각형일까",
    body:[
      "눈송이가 육각형인 까닭은 물 분자의 생김새에 있다. 물 분자는 산소 하나에 수소 둘이 붙어 약 104.5도로 벌어진 모양인데, 물이 얼면 이 분자들이 수소 결합으로 이어지며 육각형 격자를 이룬다. 결정 전체가 이 육각 대칭을 따르기 때문에, 눈송이 가지도 늘 60도와 120도 방향으로만 뻗는다.",
      "눈송이는 떨어지는 동안 공기 중 수증기가 결정 표면에 곧장 얼어붙으며 자란다. 이때 어떤 모양이 될지는 지나온 온도와 습도에 따라 크게 갈린다. 영하 15도 부근에서는 별처럼 정교하게 갈라진 가지가 나오고, 온도가 달라지면 납작한 판이나 길쭉한 기둥이 된다.",
      "여섯 갈래가 서로 똑같이 생긴 이유는 단순하다. 여섯 팔이 바싹 붙어 있어 떨어지는 내내 같은 온도와 습도를 함께 겪는다. 같은 조건을 같은 순간에 지나니 여섯 방향이 나란히 자란다. 반대로 눈송이마다 떨어지는 길이 다르니, 두 개가 똑같을 확률은 사실상 없다.",
      "이 육각 얼음은 눈송이 밖에서도 모습을 드러낸다. 겨울 유리창에 돋는 성에가 같은 결정이고, 맑은 날 해 둘레에 뜨는 빛 고리(햇무리)도 여기서 나온다. 높은 구름 속 육각 얼음 알갱이가 프리즘처럼 햇빛을 꺾어, 해에서 정확히 22도 떨어진 자리에 고리를 그린다."
    ],
    think:"아주 추운 날 내린 눈이 잘 뭉쳐지지 않고 보송보송한 것도, 결정 모양과 관계가 있을까?" },

  { field:"생물", title:"문어는 왜 심장이 3개일까",
    body:[
      "문어는 심장이 셋이다. 둘은 아가미마다 붙어 아가미로 피를 밀어 넣는 아가미 심장이고, 하나는 산소를 실은 피를 온몸으로 보내는 중심 심장이다. 아가미에서 산소를 받아 중심 심장으로, 다시 온몸으로. 펌프질을 두 단계로 나눈 구조다.",
      "왜 이렇게 진화했을까. 문어의 피는 철(헤모글로빈)이 아니라 구리를 쓰는 헤모시아닌으로 산소를 나른다. 그래서 피가 붉지 않고 푸르스름하다. 헤모시아닌은 산소를 붙드는 힘이 헤모글로빈보다 약해서, 차갑고 산소가 적은 바닷속에서 온몸에 산소를 대려면 더 세게 펌프질해야 한다. 아가미 심장 둘이 그 부족분을 메운다.",
      "대신 약점도 있다. 물을 뿜어 빠르게 헤엄칠 때는 중심 심장이 잠깐 멈춰, 문어는 금세 지친다. 그래서 헤엄치기보다 팔로 기어다니기를 좋아한다.",
      "파란 피는 문어만의 것이 아니다. 게, 새우, 거미, 투구게처럼 차가운 물이나 오래된 계통의 동물이 헤모시아닌을 쓴다. 특히 투구게의 파란 피는 세균 오염을 예민하게 잡아내, 백신과 주사제의 안전성 검사에 실제로 쓰인다."
    ],
    think:"차가운 심해에 사는 동물일수록 붉은 피보다 파란 피가 유리한 이유는 무엇일까?" },

  { field:"물리", title:"하늘은 파란데 노을은 왜 붉을까",
    body:[
      "낮 하늘이 파란 까닭은 햇빛이 공기와 부딪히는 방식에 있다. 햇빛에는 여러 색이 섞여 있는데, 파장이 짧은 파란빛일수록 공기 분자에 부딪혀 사방으로 더 잘 흩어진다. 이 현상을 레일리 산란이라 한다. 흩어진 파란빛이 하늘 어느 쪽에서나 눈에 들어와 하늘이 온통 파랗다.",
      "산란의 세기는 파장이 짧을수록 급격히 커진다. 파란빛(약 450나노미터)은 빨간빛(약 650나노미터)보다 네다섯 배 강하게 흩어진다. 해질 무렵엔 햇빛이 대기를 더 비스듬하고 길게 지난다. 그동안 파란빛은 거의 다 흩어져 사라지고, 잘 흩어지지 않는 붉은빛만 남아 노을이 붉다.",
      "그런데 하늘은 왜 파란빛보다 파장이 더 짧은 보라색이 아닐까. 햇빛에 보라 성분이 적고, 사람 눈이 보라색에 덜 민감하기 때문이다. 두 가지가 겹쳐 하늘은 남색이 아니라 하늘색으로 보인다.",
      "같은 원리를 주변에서도 본다. 멀리 있는 산이 푸르스름한 것은 산과 우리 사이의 공기가 파란빛을 흩뿌린 결과다. 반대로 구름이 하얀 것은 물방울이 공기 분자보다 훨씬 커서 모든 색을 고르게 흩기 때문이다. 색이 다 섞이면 하얗게 보인다."
    ],
    think:"구름이 두꺼워지면 왜 하얗던 것이 회색이나 먹구름으로 어두워질까?" },

  { field:"물리 · 화학", title:"얼음은 왜 물에 뜰까",
    body:[
      "거의 모든 물질은 얼면 부피가 줄어 무거워진다. 물은 반대다. 얼면 부피가 약 9퍼센트 늘고 가벼워져, 얼음이 물에 뜬다.",
      "이유는 역시 물 분자의 수소 결합에 있다. 액체인 물은 분자들이 서로 가까이 붙어 자유롭게 미끄러진다. 그런데 얼면 수소 결합이 분자들을 육각형으로 성글게 붙들어 사이에 빈 공간이 생긴다. 그래서 같은 개수의 분자가 더 넓은 자리를 차지한다.",
      "이 사소해 보이는 성질이 생명을 살린다. 겨울에 호수가 얼 때 얼음이 위에 뜨기 때문에, 그 아래 물은 얼지 않고 남는다. 물고기와 미생물은 그 아래에서 겨울을 난다. 만약 얼음이 가라앉았다면 호수는 바닥부터 통째로 얼어붙었을 것이다.",
      "겨울에 물을 꽉 채운 병이나 수도관이 얼어 터지는 것도 같은 이유다. 늘어난 부피가 갈 곳이 없어 단단한 그릇마저 밀어낸다."
    ],
    think:"그렇다면 바닷물은 왜 민물보다 더 낮은 온도에서 어는 걸까?" },

  { field:"물리", title:"검은 자동차는 왜 더 뜨거워질까",
    body:[
      "여름 주차장에서 검은 차는 흰 차보다 훨씬 뜨겁다. 색이 빛을 다루는 방식이 다르기 때문이다.",
      "물체의 색은 그 물체가 어떤 빛을 되돌려 보내는지로 정해진다. 흰색은 들어온 빛을 거의 다 반사한다. 검은색은 반대로 대부분을 흡수한다. 흡수된 빛 에너지는 열로 바뀌므로, 검은 표면은 같은 햇빛을 받아도 더 많이 데워진다.",
      "그래서 더운 지방의 집과 옷은 흰색이 많고, 태양열을 모으는 장치는 검게 칠한다. 우주복이 흰 것도 햇빛을 되도록 반사해 안을 시원하게 지키기 위해서다.",
      "다만 흡수만 문제가 아니다. 검은 물체는 열을 잘 흡수하는 만큼 잘 내보내기도 한다. 그래서 해가 지면 검은 표면이 오히려 더 빨리 식는다. 잘 받아들이는 것은 잘 돌려주기도 한다."
    ],
    think:"사막의 유목민은 뜨거운 낮에 오히려 검은 옷을 입기도 한다. 흰옷이 늘 더 시원한 게 아니라면, 그 이유는 무엇일까?" },

  { field:"물리", title:"무지개는 왜 항상 그 자리에 뜰까",
    body:[
      "무지개는 늘 해를 등지고 봐야 보이고, 언제나 일정한 각도에 걸린다. 빨간 띠는 해 반대 방향에서 약 42도, 보라 띠는 약 40도 자리에 뜬다.",
      "무지개는 공기 중 물방울이 만든다. 햇빛이 물방울에 들어가며 꺾이고(굴절), 방울 뒤쪽에서 반사된 뒤, 나오면서 다시 꺾인다. 이때 색마다 꺾이는 정도가 조금씩 달라 빛이 여러 색으로 갈라진다.",
      "여러 번 꺾이고 반사된 빛은 특정 각도에 유난히 몰린다. 그 각도가 빨강은 42도, 보라는 40도다. 그래서 무지개는 아무 데나 뜨지 않고 늘 그 각도의 둥근 띠로 나타난다. 무지개가 둥근 것도 이 각도 때문이다. 사실 무지개는 완전한 원인데, 땅에 가려 위쪽 반원만 보인다.",
      "비행기나 높은 산에서는 이따금 동그란 무지개 전체가 보인다. 물방울 대신 정원 호스의 물보라로도 같은 무지개를 만들 수 있다. 해를 등지고 물을 뿌리면 42도 자리에 작은 무지개가 걸린다."
    ],
    think:"가끔 무지개 바깥에 흐릿한 무지개가 하나 더 뜬다(쌍무지개). 이 바깥 무지개는 왜 색 순서가 반대일까?" },

  { field:"수학", title:"벌집은 왜 육각형일까",
    body:[
      "벌집의 방은 하나같이 육각형이다. 벌이 수학을 알아서가 아니라, 육각형이 가장 경제적인 모양이기 때문이다.",
      "같은 넓이의 방을 빈틈없이 이어 붙일 수 있는 정다각형은 삼각형, 사각형, 육각형뿐이다. 이 셋 중 같은 넓이를 담을 때 둘레가 가장 짧은 것이 육각형이다. 둘레가 짧다는 것은 벽을 만드는 데 드는 밀랍이 가장 적다는 뜻이다. 벌은 최소한의 재료로 최대한의 저장 공간을 얻는다.",
      "이것이 수학에서 오래 추측으로만 남아 있던 '벌집 문제'다. 평면을 같은 넓이의 방으로 나눌 때 육각형이 둘레가 가장 짧다는 사실은 1999년에야 엄밀히 증명되었다.",
      "자연은 여기저기서 같은 답을 찾아낸다. 현무암이 식으며 갈라진 주상절리, 잠자리 날개의 무늬, 거북 등딱지에도 육각형이 나타난다. 재료를 아끼거나 힘을 고르게 나눠야 할 때, 육각형은 거듭 등장한다."
    ],
    think:"눈송이도 육각형, 벌집도 육각형이다. 둘은 같은 이유로 육각형일까, 아니면 다른 이유가 우연히 같은 모양을 만든 걸까?" },

  { field:"천문학", title:"밤하늘은 왜 어두울까",
    body:[
      "밤하늘이 어둡다는 건 너무 당연해 보인다. 그런데 여기엔 깊은 수수께끼가 숨어 있다.",
      "우주가 무한히 넓고, 별이 고르게 흩어져 영원히 존재해 왔다면, 어느 방향을 보든 시선 끝에는 반드시 별이 하나 걸려야 한다. 그렇다면 밤하늘은 온통 별빛으로 대낮처럼 밝아야 한다. 하지만 실제로는 캄캄하다. 이 모순을 '올베르스의 역설'이라 한다.",
      "답은 우주가 무한히 오래되지 않았다는 데 있다. 우주는 약 138억 년 전에 시작했고, 빛의 속도는 유한하다. 그래서 우리에게 닿을 시간이 없었던 먼 별의 빛은 아직 오지 못했다. 볼 수 있는 우주 안에는 하늘을 다 채울 만큼의 별이 없다.",
      "게다가 우주는 팽창하고 있어, 먼 별빛은 늘어나며 붉게, 더 나아가 눈에 안 보이는 빛으로 바뀐다. 밤하늘의 어둠은 별이 적어서가 아니라, 우주에 시작이 있었음을 말해 준다."
    ],
    think:"우주에 시작이 있었다면, 그 '시작 이전'을 묻는 것은 과연 의미가 있는 질문일까?" },

  { field:"천문학", title:"달은 왜 늘 같은 면만 보일까",
    body:[
      "우리는 언제나 달의 같은 얼굴만 본다. 달의 뒷면은 지구에서 결코 보이지 않는다. 달이 아예 돌지 않아서가 아니다. 오히려 그 반대다.",
      "달이 지구를 한 바퀴 도는 시간과, 제자리에서 한 바퀴 자전하는 시간이 정확히 같다. 둘 다 약 27.3일이라, 늘 같은 면이 지구를 향한다. 이렇게 공전과 자전 주기가 맞물린 상태를 '조석 고정'이라 한다.",
      "이건 우연이 아니다. 지구의 중력은 달을 살짝 잡아당겨 럭비공처럼 아주 조금 늘여 놓는다. 아주 오랜 세월 이 힘이 달의 자전에 브레이크를 걸었고, 마침내 한 면이 지구를 향한 채 멈추듯 고정됐다.",
      "같은 일이 태양계 곳곳에서 일어난다. 목성과 토성의 큰 위성들도 대개 행성에 한 면만 보인다. 그리고 지금은 달이 지구의 자전마저 아주 느리게 늦추고 있다. 먼 미래에는 하루가 지금보다 훨씬 길어질 것이다."
    ],
    think:"달이 지구의 자전을 늦춰 잃게 만든 힘은 어디로 갈까? (실제로 달은 매년 약 3.8센티미터씩 지구에서 멀어지고 있다)" },

  { field:"생물", title:"물에 오래 담근 손가락은 왜 쭈글쭈글해질까",
    body:[
      "목욕을 오래 하면 손끝과 발바닥이 쭈글쭈글해진다. 물이 스며들어 피부가 부푼 탓이라 여기기 쉽지만, 사실은 그렇지 않다.",
      "이 주름은 신경계가 일부러 만든다. 손끝이 물에 오래 닿으면 자율신경이 손가락 속 혈관을 수축시키고, 그 위 피부가 오그라들며 골이 진다. 증거가 있다. 신경이 다친 손가락은 물에 담가도 주름이 지지 않는다. 단순히 물에 불어서라면 신경과 상관없이 주름이 져야 한다.",
      "왜 이런 기능이 진화했을까. 한 연구에서 쭈글쭈글한 손가락은 젖은 물체를 더 잘 집었다. 자동차 타이어의 홈이나 빗물 배수로처럼, 주름이 물길을 내어 미끄러짐을 줄인다는 설명이다. 젖은 환경에서 무언가를 단단히 쥐도록 돕는다는 것이다.",
      "아직 논쟁은 남아 있다. 주름이 실제로 손힘을 얼마나 키우는지는 연구마다 결과가 엇갈린다. 다만 이 주름이 물 때문에 수동적으로 생기는 게 아니라, 몸이 상황을 읽고 능동적으로 만드는 반응이라는 점은 분명하다."
    ],
    think:"손끝뿐 아니라 발바닥도 함께 쭈글쭈글해진다. 발의 주름은 우리 조상에게 무엇을 더 잘하게 해 주었을까?" },
  {"field":"지구과학","title":"사막의 모래언덕은 왜 늘 비슷한 경사로 서 있을까","body":["사막 사진 속 모래언덕은 어디서 찍은 것이든 이상하게 닮은 기울기로 서 있다. 바람이 만든 능선 뒤쪽, 바람그늘 방향의 비탈은 대체로 30도 초반에서 35도 사이에 모여 있다. 손으로 마른 모래를 한 줌 흘려 원뿔을 쌓아 봐도 어느 순간 더는 가팔라지지 않고 옆으로 무너지며 늘 비슷한 각도로 자리를 잡는다. 재료가 모래든 설탕이든 마른 곡식이든, 이 멈추는 각도는 놀랄 만큼 일정하게 나타난다.","이 각도를 안식각(angle of repose)이라 부른다. 모래알 하나가 비탈에 머무르려면 아래로 미끄러뜨리는 중력의 성분과 알갱이 사이의 마찰이 겨루어야 한다. 경사가 완만하면 마찰이 이겨 알갱이가 그대로 붙어 있고, 경사가 어느 문턱을 넘으면 중력이 이겨 위쪽 알갱이가 굴러 내린다. 그래서 비탈은 무너짐과 쌓임을 반복하다가 두 힘이 아슬아슬하게 균형을 이루는 각도에서 멈춘다. 마른 모래에서 이 값이 대략 34도 안팎이라는 것은 마찰의 세기가 알갱이의 모양과 표면 거칠기에 주로 달려 있기 때문이다.","각도를 결정하는 것은 알갱이의 생김새다. 표면이 거칠고 모난 알갱이는 서로 잘 맞물려 더 가파른 비탈도 버티고, 매끈하고 둥근 알갱이는 쉽게 굴러 완만한 각도에서 멈춘다. 바람에 오래 실려 다닌 사막 모래는 크기가 고르게 걸러지고 표면이 닳아 둥글어지는 편이라, 안식각이 좁은 범위에 몰린다. 습기도 변수가 된다. 물기가 조금 있으면 알갱이 사이에 얇은 물다리가 생겨 서로 붙잡아 주므로 젖은 모래로는 더 가파른 성을 쌓을 수 있다. 다만 물이 지나치게 많으면 오히려 알갱이가 미끄러져 각도가 다시 무너진다.","같은 원리는 사막 밖에서도 흔히 보인다. 설탕이나 소금을 그릇에 부을 때 생기는 원뿔, 공사장의 자갈 더미, 곡식 저장고에 쌓인 낟알 산이 모두 각자의 안식각을 지킨다. 산비탈에서 부스러진 돌조각이 굴러 쌓인 애추(talus) 지형도 그 물질이 버틸 수 있는 경사에서 안정된 모습으로 서 있다. 눈이 특정 경사 이상에서 쉽게 미끄러져 눈사태를 일으키는 것도 결국 같은 힘겨루기다. 알갱이 하나하나의 마찰과 중력이 겨룬 결과가, 우리가 자연에서 보는 비탈의 기울기를 조용히 정해 놓는다."],"think":"모래는 왜 물처럼 흐르지도, 벽돌처럼 쌓이지도 않고 딱 그 각도에서 멈출까."},
  {"field":"물리","title":"왜 유리잔은 뜨거운 물 한 잔에 깨질까","body":["찬 유리잔에 갓 끓인 물을 부으면 쨍 하는 소리와 함께 잔이 갈라진다. 물이 닿은 안쪽 벽은 순식간에 뜨거워지지만, 바깥쪽 벽은 아직 차갑다. 유리는 대부분의 물질처럼 온도가 오르면 부피가 늘어나는 열팽창을 겪는다. 문제는 한 덩어리인 유리 안에서 안쪽만 팽창하고 바깥쪽은 그대로 있으려 한다는 데 있다.","안쪽 벽이 늘어나려 하면 아직 차가운 바깥 벽이 그 팽창을 붙잡는다. 서로 다른 방향으로 잡아당기는 힘, 즉 열응력이 유리 안에 쌓인다. 유리는 금속처럼 늘어나며 힘을 흘려보내지 못하고, 응력이 견딜 수 있는 한계를 넘는 순간 표면의 작은 흠집에서부터 단번에 금이 간다. 부은 물이 뜨거울수록, 안팎의 온도차가 클수록 이 응력은 커진다.","얇고 균일한 유리잔이 두꺼운 잔보다 덜 깨지는 이유도 여기서 나온다. 벽이 얇으면 안과 밖의 온도가 빨리 같아져 온도차가 오래 유지되지 않는다. 반대로 두꺼운 머그잔이나 밑바닥이 도톰한 잔은 열이 반대편까지 퍼지는 데 시간이 걸려, 그동안 응력이 크게 쌓인다. 유리를 데우는 속도가 아니라 부위별 온도차가 승부를 가른다.","이 원리는 부엌 곳곳에서 반복된다. 오븐용 내열유리(파이렉스 계열)는 열팽창 계수를 낮춰 온도차에 강하게 만든 유리다. 뜨거운 유리 용기를 젖은 행주 위에 올리면 바닥이 급히 식으며 갈라지고, 겨울철 성에 낀 차가운 자동차 앞유리에 뜨거운 물을 부으면 같은 이유로 금이 간다. 반대로 유리에 미리 미지근한 물을 조금 부어 온도를 맞춰두면, 온도차를 줄여 깨짐을 막을 수 있다."],"think":"유리는 왜 늘어나며 힘을 흘려보내지 못하고, 금속은 휘면서 버틸까"},
  {"field":"물리","title":"물은 왜 그렇게 많은 열을 품을 수 있을까","body":["냄비에 물을 올리면 데워지는 데 한참 걸린다. 같은 불에 빈 냄비를 올리면 순식간에 손을 델 만큼 뜨거워지는데, 물은 좀처럼 데워지지 않는다. 이 답답함의 정체가 바로 비열이다. 비열은 어떤 물질 1그램의 온도를 섭씨 1도 올리는 데 필요한 열의 양이고, 물의 비열은 대략 4.2줄로 흔한 물질 가운데 유난히 크다. 같은 무게의 철은 물의 10분의 1가량이면 온도가 1도 오른다.","물이 이렇게 열을 많이 삼키는 까닭은 물 분자끼리 서로 강하게 붙들고 있기 때문이다. 물 분자는 한쪽은 살짝 양전기, 다른 쪽은 살짝 음전기를 띠는 치우친 구조라, 이웃 분자와 수소결합이라는 끈끈한 연결을 맺는다. 물에 열을 넣으면 그 에너지의 상당 부분이 분자를 더 빨리 움직이게 하는 데 쓰이기 전에 먼저 이 결합을 흔들고 끊는 데 소모된다. 온도는 분자의 평균 운동에너지를 반영하므로, 에너지가 결합을 푸는 데 새어 나가는 만큼 온도는 더디게 오른다.","이 성질은 데우기 어렵다는 뜻인 동시에 식히기도 어렵다는 뜻이다. 한번 품은 열을 물은 천천히 내놓는다. 바다와 큰 호수가 여름에 좀처럼 뜨거워지지 않고 겨울에도 육지만큼 빨리 차가워지지 않는 것이 그 증거다. 해안 도시의 기온이 내륙 도시보다 하루 안에서도, 계절 사이에서도 덜 출렁이는 배경에는 이 거대한 물의 열 저장 능력이 있다.","우리 몸도 이 원리에 기대고 있다. 사람 몸은 대부분 물로 채워져 있어서 바깥 기온이 오르내려도 체온이 급하게 따라가지 않는다. 더울 때 땀이 증발하며 몸을 식히는 것도, 물이 액체에서 기체로 바뀔 때 특히 많은 열을 데리고 떠나기 때문이다. 자동차 냉각수로 물을 쓰고, 옛날부터 온수 주머니로 밤새 온기를 붙잡아 둔 것 모두 같은 이유에서 나왔다."],"think":"한여름 바다는 왜 육지보다 늦게 데워지고 늦게 식을까?"},
  {"field":"물리","title":"왜 CD 뒷면에서는 무지개가 생길까","body":["오래된 CD나 DVD를 형광등 아래에서 기울여 보면 은빛 표면 위로 무지개가 흐른다. 각도를 조금만 바꿔도 빨강이 파랑으로 밀려나고 색의 띠가 표면을 따라 흐르듯 움직인다. 물감이나 색소가 칠해진 것도 아닌데 색이 나타난다는 점이 이상하게 느껴진다. 비눗방울이나 기름막에서 보는 색과도 원리가 조금 다르다.","CD 뒷면에는 데이터를 담은 아주 가느다란 홈이 나선 모양으로 촘촘하게 새겨져 있다. 이 홈 사이의 간격은 대략 1.6마이크로미터, DVD는 더 좁아 0.74마이크로미터 정도다. 사람 머리카락 굵기의 수십분의 1밖에 안 되는 이 간격이 가시광선의 파장(약 0.4~0.7마이크로미터)과 비슷한 크기라는 점이 핵심이다. 빛의 파장과 비슷한 간격으로 촘촘한 줄무늬가 늘어서 있으면 회절(diffraction)이라는 현상이 일어난다.","빛은 홈에 부딪혀 여러 방향으로 퍼지는데, 퍼진 빛의 물결이 서로 만나 어떤 방향에서는 마루와 마루가 겹쳐 밝아지고 다른 방향에서는 서로 상쇄되어 어두워진다. 이 밝아지는 방향은 빛의 파장에 따라 달라져서, 파장이 긴 빨강과 짧은 파랑이 저마다 다른 각도로 튀어나온다. 그래서 흰빛이 색깔별로 부챗살처럼 갈라지고, 보는 각도를 바꾸면 눈에 들어오는 색이 순서대로 바뀐다. 이렇게 규칙적인 줄무늬로 빛을 나누는 것을 회절격자(diffraction grating)라 부르며, CD는 사실상 하나의 회절격자다.","같은 원리는 주변 곳곳에 숨어 있다. 공작 깃털이나 나비 날개, 딱정벌레 껍데기의 금속성 광택은 색소가 아니라 나노 크기의 규칙적 구조가 빛을 나눠 만드는 구조색이다. 천문학과 화학에서 쓰는 분광기도 회절격자로 빛을 파장별로 펼쳐 별과 물질의 성분을 읽어낸다. CD 한 장에서 흘러나온 무지개가, 별빛의 성분을 분석하는 도구와 같은 원리로 움직인다."],"think":"비눗방울의 무지개와 CD의 무지개는 같은 색놀이일까, 아니면 서로 다른 원리가 우연히 비슷하게 보이는 걸까."},
  {"field":"물리","title":"왜 눈은 하얀데 얼음은 투명할까","body":["겨울 창밖의 눈밭은 눈이 부실 만큼 새하얗다. 그런데 그 눈을 손으로 꾹 뭉쳐 얼리면 반투명한 얼음덩이가 되고, 냉동실에서 천천히 언 얼음은 유리처럼 속이 비친다. 같은 물이 얼었을 뿐인데 하나는 하얗고 하나는 투명하다. 색을 가르는 것은 성분이 아니라 얼음이 놓인 모양이다.","얼음 자체는 색이 없고, 빛을 거의 그대로 통과시킨다. 눈은 그런 얼음이 아주 작은 결정 알갱이 수억 개로 쪼개진 상태다. 빛이 한 알갱이의 표면을 만날 때마다 방향이 꺾이고, 알갱이와 알갱이 사이의 공기 틈에서 또 꺾인다. 이렇게 무수히 되풀이되는 꺾임과 되튐을 산란이라 부른다. 결국 들어온 빛은 안으로 깊이 못 들어가고 사방으로 흩어져 눈 밖으로 되돌아 나온다.","여기서 왜 하필 흰색인지가 갈린다. 얼음은 빨강부터 보라까지 모든 색의 빛을 특정 색만 골라 삼키지 않고 고루 흩뿌린다. 파장을 가리지 않고 되튄 빛이 눈에 한꺼번에 들어오면 우리는 그것을 흰색으로 본다. 우유가 하얀 것, 거품과 소금과 설탕 가루가 하얀 것도 같은 이치다. 투명한 알갱이가 촘촘히 모여 빛을 골고루 되던지면 재료가 무엇이든 하얗게 보인다.","그러니 색을 만드는 것은 경계면의 수다. 알갱이가 잘게 쪼개져 표면과 공기 틈이 많을수록 빛은 더 자주 꺾여 하얘지고, 얼음이 한 덩어리로 뭉쳐 안에 틈이 없으면 빛은 곧게 지나 투명해진다. 서리 낀 유리가 뿌옇다가 입김에 녹으면 맑아지는 것도, 잘게 부순 얼음이 통얼음보다 희끄무레한 것도 같은 원리다. 흰색과 투명함 사이의 거리는 그저 빛이 몇 번 꺾이느냐에 달려 있다."],"think":"그렇다면 흰 눈을 계속 밟아 다지면, 어느 순간부터 투명해지기 시작할까"},
  {"field":"물리","title":"비눗방울은 왜 완벽한 공 모양이 될까","body":["빨대로 비눗물을 불면 쭈글쭈글한 막이 부풀다가 손을 떠나는 순간 반듯한 공으로 자리를 잡는다. 정육면체 비눗방울이나 길쭉한 원기둥 비눗방울을 본 사람은 없다. 물을 아무리 흔들어도 물방울이 저절로 둥글게 뭉치는 것과 같은 일이 얇은 비누막에서도 벌어진다. 이 한결같은 모양 뒤에는 표면장력이라는 힘이 있다.","물 분자는 서로 끌어당긴다. 액체 안쪽 분자는 사방에서 이웃에게 골고루 당겨지지만, 표면에 있는 분자는 바깥쪽에 당겨줄 이웃이 없어 안으로만 끌린다. 그래서 표면은 스스로 면적을 최대한 줄이려 하며, 마치 팽팽하게 당겨진 얇은 고무막처럼 행동한다. 비눗방울의 막은 이 표면이 안팎 두 겹으로 이루어져 있고, 비누 분자가 물의 표면장력을 적당히 낮춰 막이 쉽게 터지지 않고 넓게 펴지도록 돕는다.","같은 부피를 담으면서 겉넓이가 가장 작은 도형은 공이다. 표면장력은 겉넓이를 줄이려는 방향으로 끊임없이 막을 당기므로, 안에 갇힌 공기의 부피가 정해진 상태에서 막은 겉넓이가 최소가 되는 형태, 곧 공으로 수렴한다. 다른 모양에는 튀어나온 곳과 들어간 곳마다 힘의 불균형이 남아 있어 계속 다듬어지지만, 완벽한 공에서는 어느 지점이나 당겨지는 정도가 똑같아 더는 바뀔 이유가 없다. 실제로는 중력이 아래쪽에 물을 조금 쏠리게 해서 큰 비눗방울일수록 아주 살짝 눌린 모양이 되기도 한다.","이 원리는 주변 곳곳에서 다시 나타난다. 소금쟁이가 물 위에 뜨는 것도, 유리창의 빗방울이 둥글게 맺히는 것도 같은 힘 때문이다. 여러 개의 비눗방울이 붙으면 막들이 만나는 자리는 늘 세 장의 막이 약 120도로 갈라지는데, 이는 전체 표면적을 가장 작게 만드는 배치다. 표면을 줄이려는 이 고집스러운 경향이 비누 거품의 구조부터 곤충의 발끝까지 조용히 모양을 결정한다."],"think":"중력이 훨씬 강한 큰 행성 위에서 비눗방울을 불면 어떤 모양이 될까."},
  {"field":"생물","title":"왜 상처는 아물 때 가려울까","body":["무릎이 까진 뒤 며칠이 지나면 딱지 주변이 스멀스멀 가렵기 시작한다. 아프던 시기가 지나 이제 나아간다 싶은 무렵에 하필 가려움이 찾아온다. 참다못해 긁으면 딱지가 떨어지고 다시 쓰라리니, 몸이 왜 이런 신호를 보내는지 야속하게 느껴진다.","가려움은 상처가 새 살을 짓는 과정에서 따라오는 부산물이다. 상처가 아물 때 피부 밑에서는 콜라겐 섬유가 새로 짜이고, 끊어졌던 신경 끝이 다시 자란다. 이 과정에서 세포들은 히스타민을 비롯한 여러 화학 물질을 내놓는데, 이 물질들이 피부의 감각 신경을 자극한다. 자라나는 어린 신경은 예민해서 약한 자극에도 쉽게 반응하고, 뇌는 그 신호를 가려움으로 해석한다.","가려움과 통증은 서로 다른 감각이지만 신경 경로가 겹치는 부분이 많다. 가려움을 전달하는 신경 섬유는 통증을 전달하는 섬유와 얽혀 있어서, 우리가 가려운 곳을 긁으면 약한 통증 신호가 잠시 가려움 신호를 밀어낸다. 긁을 때 시원한 느낌이 드는 이유가 여기에 있다. 다만 긁는 자극은 다시 히스타민을 부르기 때문에 긁을수록 더 가려워지는 되먹임이 생기기 쉽다.","이런 원리는 상처 밖에서도 흔히 관찰된다. 모기에 물린 자리가 붓고 가려운 것도 침 속 물질에 대한 면역 반응으로 히스타민이 나오기 때문이고, 건조한 겨울철 피부가 가려운 것도 갈라진 피부에서 신경 끝이 쉽게 자극받기 때문이다. 알레르기 약에 흔히 든 항히스타민 성분이 이런 가려움을 눌러 주는 것도 같은 고리를 끊는 방식이다. 가려움은 대개 몸이 무언가를 고치거나 지키는 중이라는 신호에 가깝다."],"think":"통증은 피하라는 경고인데, 가려움은 대체 우리에게 무엇을 하라고 보내는 신호일까."},
  {"field":"생물","title":"왜 같은 냄새는 금방 못 맡게 될까","body":["집에 처음 들어온 사람은 그 집 특유의 냄새를 대번에 알아챈다. 정작 그 집에 사는 사람은 아무 냄새도 못 맡는다. 향수를 뿌린 사람이 스스로는 향을 거의 못 느끼면서 자꾸 덧뿌리는 일도 같은 이치다. 냄새 자체가 사라진 것이 아니라, 그 냄새를 감지하는 몸의 장치가 잠시 손을 놓았을 뿐이다.","코 안쪽 위에는 냄새를 잡아내는 후각 신경세포가 깔려 있고, 그 세포 표면에는 특정 분자와 맞물리는 후각 수용체가 박혀 있다. 사람은 이런 수용체 유전자를 대략 400종 정도 가지고 있고, 냄새 분자가 여기에 달라붙으면 세포가 전기 신호를 만들어 뇌로 보낸다. 그런데 같은 냄새 분자가 계속 쏟아져 들어오면 이 세포는 신호를 점점 약하게 낸다. 자극이 그대로인데도 반응이 줄어드는 현상을 감각 적응이라고 부른다.","적응이 일어나는 자리는 여러 층이다. 수용체 세포 안에서는 신호를 켜는 통로가 칼슘 같은 물질에 의해 도로 닫히면서 스스로 반응을 낮춘다. 여기에 더해 뇌의 후각 담당 영역도 익숙해진 냄새 정보를 걸러내는 것으로 알려져 있다. 몸이 게을러서가 아니라, 변하지 않는 배경 신호를 계속 보고하는 일이 낭비이기 때문이다. 감각은 절대적인 세기보다 변화에 민감하도록 짜여 있다.","이런 걸러내기는 후각에만 있지 않다. 옷을 입은 직후에는 촉감이 느껴지다가 곧 잊히고, 형광등의 웅웅거림도 몇 분 지나면 안 들린다. 밝은 데서 어두운 극장에 들어가면 처음엔 깜깜하다가 차차 보이는 것도 눈이 새 밝기에 기준을 다시 맞추는 적응이다. 냄새가 사라진 자리에서, 감각이 세상의 무엇을 지우고 무엇을 남기는지가 드러난다."],"think":"냄새를 못 느끼게 되는 것과, 그 냄새를 기억에서 지우는 것은 같은 일일까 다른 일일까."},
  {"field":"생물","title":"DNA는 왜 하필 이중나선 모양일까","body":["옷의 지퍼를 떠올려 보자. 이빨 두 줄이 서로 어긋나게 맞물려 한 줄로 잠기고, 손잡이를 당기면 다시 두 줄로 갈라진다. DNA도 이와 비슷하게 두 가닥이 안쪽에서 맞물린 채 배배 꼬여 있다. 1953년 왓슨과 크릭이 밝힌 이 구조를 이중나선이라 부른다. 생명의 설계도가 하필 이런 꼬인 사다리 꼴을 하고 있다는 사실은 우연이 아니라 화학의 제약에서 나온 결과다.","핵심은 안쪽에서 맞물리는 염기 네 종류에 있다. 아데닌(A)은 티민(T)하고만, 구아닌(G)은 사이토신(C)하고만 짝을 짓는다. 이 짝짓기는 취향이 아니라 크기와 결합의 문제다. A와 T는 수소결합 두 개로, G와 C는 세 개로 붙는데, 크기가 큰 염기와 작은 염기가 짝을 이뤄야 사다리의 폭이 일정하게 유지된다. 폭이 들쭉날쭉하면 구조가 뒤틀려 버리므로, 이 상보성 규칙이 두 가닥을 안정적으로 붙잡는 뼈대가 된다.","그런데 왜 평평한 사다리가 아니라 꼬인 나선일까. 염기들은 물을 싫어하는 성질이 있어 안쪽으로 차곡차곡 겹쳐 쌓이려 하고, 이 쌓임을 가장 촘촘하고 안정하게 만들려다 보니 두 가닥이 자연스럽게 비틀린다. 대략 열 개의 염기쌍마다 한 바퀴를 돌아 오른쪽으로 감기며, 바깥쪽 당과 인산 골격은 물과 잘 어울려 바깥을 향한다. 이 배치는 한 가닥의 순서만 알면 다른 가닥을 자동으로 알 수 있게 해서, 복제할 때 지퍼처럼 갈라 각 가닥을 본으로 삼는 일을 가능하게 한다.","이런 상보적 짝짓기의 흔적은 실험실 바깥에서도 만난다. 유전자 검사에서 특정 DNA 조각을 찾아내는 것도, 코로나 진단에 쓰인 유전자증폭검사(PCR)가 미량의 DNA를 수십억 배로 불리는 것도 모두 두 가닥이 갈라졌다 다시 상보적으로 맞물리는 성질에 기댄다. 지퍼처럼 열고 닫히면서도 짝이 정해져 있어 정보가 흐트러지지 않는 것, 이중나선의 이 두 얼굴이 생명이 정보를 안전하게 물려주는 방식의 근간이다."],"think":"만약 염기가 네 종류가 아니라 두 종류거나 여섯 종류였다면 생명의 설계도는 어떤 모양이 되었을까."},
  {"field":"생물","title":"왜 바이러스는 살아있는 생물로 치지 않을까","body":["감기에 걸리면 콧속에서 바이러스가 늘어나고, 몸을 옮겨 다니며 다른 사람에게 옮는다. 늘어나고 퍼지고 유전자를 물려주니 살아있는 것처럼 보인다. 그런데 대부분의 생물학 교과서는 바이러스를 생물로 치지 않는다. 살아있음의 기준을 무엇으로 잡느냐에 따라 바이러스가 경계 밖으로 밀려나기 때문이다.","생물을 정의하는 흔한 기준은 스스로 물질대사를 하고, 세포로 이루어져 있으며, 혼자 힘으로 번식한다는 세 가지다. 세균 한 마리는 당을 먹어 에너지를 만들고 스스로 분열해 둘이 된다. 바이러스는 이 셋을 하나도 갖추지 못한다. 유전 정보를 담은 핵산과 그것을 감싼 단백질 껍질이 거의 전부이고, 에너지를 만드는 기관도 스스로 자라는 기능도 없다.","핵심은 번식 방식에 있다. 바이러스는 혼자서는 자기 복제를 못 한다. 숙주 세포 안으로 들어가 그 세포의 리보솜과 효소, 재료를 빌려 자기 부품을 찍어내게 만든다. 숙주 밖에 있는 바이러스 입자는 화학 결정처럼 아무 활동도 하지 않고 가만히 놓여 있을 뿐이다. 스스로 하는 일이 없으니 살아있다고 부르기 어렵다는 것이 생물로 치지 않는 주된 근거다.","그렇다고 무생물이라고 딱 잘라 말하기도 어렵다. 바이러스는 유전자를 갖고 돌연변이를 일으키며 자연선택으로 진화한다. 독감 백신을 해마다 새로 만드는 이유도 바이러스가 빠르게 변하기 때문이다. 살아있음과 죽어있음 사이 어딘가에 놓인 존재라, 생물학자들은 여전히 그 경계를 어디에 그을지 논쟁한다."],"think":"스스로 하는 일이 하나도 없어도, 진화하고 변한다면 그것을 생명이라 불러야 할까."},
  {"field":"천문학","title":"왜 블랙홀은 빛도 가두면서 온도를 가질까","body":["뜨거운 물체는 빛을 낸다. 달궈진 쇠는 붉게, 더 뜨거우면 하얗게 빛나고, 우리 몸도 눈에 안 보이는 적외선을 내뿜는다. 온도가 있다는 말은 곧 무언가를 바깥으로 내보낸다는 뜻이다. 그런데 블랙홀은 정의부터가 빛조차 빠져나올 수 없는 영역이다. 안에서 밖으로 아무것도 못 나온다면 블랙홀에 온도를 붙이는 일 자체가 앞뒤가 안 맞아 보인다.","1974년 스티븐 호킹은 블랙홀도 아주 미약한 빛을 내며 천천히 증발한다고 계산했다. 열쇠는 블랙홀 자체가 아니라 그 경계선인 사건의 지평선 바로 바깥의 진공에 있다. 양자역학에서 진공은 완전한 무가 아니라, 입자와 반입자 쌍이 끊임없이 생겼다가 곧바로 다시 만나 사라지는 들끓는 바다다. 평소에는 쌍이 즉시 소멸해 아무 일도 없지만, 지평선 근처에서는 사정이 달라진다.","지평선 바로 위에서 쌍이 생겨날 때, 한쪽은 안으로 빨려 들어가고 다른 한쪽은 바깥으로 달아날 수 있다. 짝을 잃은 바깥쪽 입자는 다시 만나 사라지지 못하고 실제 빛으로 우주에 남는다. 멀리서 보면 블랙홀이 스스로 빛을 뿜는 것처럼 보이고, 그만큼 블랙홀은 에너지, 곧 질량을 잃는다. 이 빛의 스펙트럼이 뜨거운 물체의 것과 똑같은 모양이어서 우리는 여기에 온도를 붙일 수 있다.","이 온도는 상상하기 어려울 만큼 낮다. 태양 몇 배 무게의 블랙홀이라면 온도가 절대영도 위 1억분의 1도에도 못 미쳐, 우주 배경 복사보다도 훨씬 차갑다. 게다가 블랙홀은 가벼울수록 더 뜨겁고 빠르게 증발하는 거꾸로 된 성질을 갖는다. 별이 남긴 블랙홀 하나가 다 증발하려면 우주 나이의 10의 50제곱 배가 훌쩍 넘는, 사실상 가늠할 수 없이 긴 시간이 걸려서, 호킹 복사는 아직 직접 관측된 적이 없다."],"think":"완벽한 진공, 아무것도 없는 빈 공간에서 무언가가 저절로 생겨날 수 있을까."},
  {"field":"천문학","title":"왜 행성과 별은 거의 다 둥글까","body":["밤하늘의 달도, 사진으로 보는 지구도, 목성도 모두 공처럼 둥글다. 반면 책상 위의 돌멩이나 소행성 이미지는 울퉁불퉁하고 제멋대로 생겼다. 크기가 커질수록 둥글어진다는 규칙이 하늘에 숨어 있다. 이 차이를 만드는 힘이 중력이다.","모든 물체는 자기 질량으로 서로를 끌어당긴다. 작은 돌멩이의 중력은 너무 약해서 바위의 단단함을 이기지 못하고, 그래서 돌은 생긴 그대로 각진 모양을 유지한다. 그러나 질량이 충분히 커지면 중력이 물질 자체의 버티는 힘을 눌러버린다. 중력은 모든 방향에서 중심을 향해 똑같이 잡아당기므로, 튀어나온 부분은 끌려 내려가고 움푹한 부분은 메워진다. 그 결과 중심에서 표면까지 거리가 어디서나 비슷한 모양, 곧 구가 만들어진다.","이 경계가 되는 크기가 대략 지름 수백 킬로미터쯤이다. 바위질 천체는 지름 600킬로미터 안팎, 얼음처럼 무른 천체는 그보다 작아도 둥글어진다. 지름 약 400킬로미터인 토성의 위성 미마스는 거의 공 모양인 반면, 그보다 훨씬 작은 화성의 위성 포보스는 감자처럼 찌그러져 있다. 천체가 스스로의 중력으로 둥글어질 만큼 커졌는가는 왜소행성을 가르는 기준의 하나이기도 하다.","둥글다고 해서 완벽한 구는 아니다. 빠르게 자전하는 별과 행성은 적도 쪽이 원심력에 밀려 살짝 부풀어 오른다. 지구도 적도 지름이 극 지름보다 약 43킬로미터 길어, 정확히는 살짝 눌린 공 모양이다. 목성처럼 열 시간 만에 한 바퀴 도는 행성은 눈으로도 알아볼 만큼 배가 나와 있다. 중력이 모양을 둥글게 빚고, 자전이 그 둥근 모양을 다시 살짝 늘리는 셈의 균형이 하늘의 천체마다 다른 얼굴을 만든다."],"think":"그렇다면 중력이 지금보다 훨씬 약한 우주였다면, 별과 행성은 어떤 모양으로 태어났을까."},
  {"field":"천문학","title":"토성의 고리는 왜 그렇게 얇을까","body":["망원경으로 본 토성의 고리는 넓고 화려하다. 지름은 대략 27만 킬로미터에 이르러 지구와 달 사이 거리의 절반을 훌쩍 넘는다. 그런데 이 거대한 원반의 두께는 대부분 구간에서 겨우 10미터 안팎이다. 지름과 두께의 비율만 놓고 보면 종이 한 장을 축구장만큼 넓게 펼친 것보다 훨씬 더 얇다.","고리가 이렇게 납작한 이유는 그것을 이루는 재료가 얼음과 암석 알갱이 수억 개이기 때문이다. 알갱이들은 저마다 토성 둘레를 도는데, 궤도가 조금씩 위아래로 기울어 있으면 서로 스치고 부딪친다. 충돌할 때마다 위아래로 튀는 움직임은 열로 흩어져 사라지고, 수평으로 도는 움직임은 각운동량 보존 탓에 쉽게 사라지지 않는다. 그 결과 알갱이들은 점점 한 평면으로 눌려 모인다.","이렇게 얇아진 상태는 최소 에너지 배치에 가깝다. 두께가 얇을수록 알갱이끼리 부딪칠 일이 줄어 더는 눌릴 여지가 없어진다. 토성 자체가 완벽한 구가 아니라 적도가 부푼 모양이라, 그 중력이 알갱이 궤도를 적도면으로 끌어당기는 힘도 얇은 원반을 유지하는 데 보탬이 된다. 얇음은 애초의 모양이 아니라 수많은 충돌이 오랜 시간 다듬은 결과다.","같은 원리는 하늘 곳곳에서 되풀이된다. 우리 은하가 접시처럼 납작한 나선 원반인 것도, 갓 태어난 별 둘레에서 행성이 빚어지는 원시행성 원반이 평평한 것도 회전과 충돌이 함께 만든 모습이다. 밤하늘의 은하수가 하나의 띠로 길게 늘어져 보이는 까닭 역시 우리가 그 얇은 원반 안쪽에서 원반을 옆으로 바라보기 때문이다."],"think":"회전하는 것들은 왜 자꾸 납작한 원반이 되려 할까."},
  {"field":"지구과학","title":"현무암은 왜 육각형 기둥으로 갈라질까","body":["제주 해안이나 경주 양남에 가면 돌기둥이 다발로 서 있는 절벽을 만난다. 기둥 하나하나는 위에서 내려다보면 대체로 오각형이나 육각형을 이루고, 이런 지형을 주상절리라 부른다. 사람이 깎은 듯 반듯한 모양이라 인공물처럼 보이지만, 이것은 흘러나온 용암이 식으면서 저절로 갈라진 자연의 흔적이다.","돌기둥의 열쇠는 부피 수축에 있다. 뜨거운 용암이 굳어 현무암이 되면 온도가 내려가고, 물질은 식을 때 조금씩 쪼그라든다. 두껍게 쌓인 용암은 위와 아래에서 식기 때문에 표면에서 안쪽으로 향하는 온도의 층이 생긴다. 각 층은 옆으로 오그라들고 싶어 하지만 붙어 있는 이웃 때문에 마음대로 줄지 못하니, 결국 잡아당기는 힘을 못 견디고 금이 가며 조각으로 쪼개진다.","그렇다면 왜 하필 육각형에 가까운 모양일까. 갈라짐은 여러 개의 중심점에서 시작해 사방으로 퍼지는데, 이웃한 균열끼리 만나는 지점에서 세 갈래로 갈라질 때 세 각이 약 120도로 벌어지는 배치가 축적된 힘을 가장 효율적으로 풀어낸다. 이 120도 이음매가 평면을 빈틈없이 채우면 자연히 육각형에 가까운 격자가 나온다. 실제 현장에서는 온도가 고르지 않아 오각형과 칠각형도 섞이지만, 평균으로 보면 여섯 모서리 쪽으로 수렴한다.","같은 원리는 규모만 다를 뿐 주변 곳곳에서 반복된다. 논바닥이 가뭄에 말라 물기가 빠지면서 쩍쩍 갈라진 진흙 조각도, 오래된 도자기 유약의 잔금도 부피 수축이 만드는 균열이다. 옥수수 전분을 물에 갠 뒤 천천히 말리는 실험에서도 작은 기둥 구조가 관찰된다. 물질과 크기가 달라도 '균일하게 수축하며 힘을 가장 적게 들여 갈라진다'는 규칙이 같기에, 진흙 웅덩이에서 거대한 용암 절벽까지 닮은 무늬가 새겨진다."],"think":"벌집도 육각형, 비눗방울 경계도 육각형이다. 자연은 왜 자꾸 여섯 모서리로 갈라지는 걸까?"},
  {"field":"지구과학","title":"번개는 왜 곧게 안 가고 지그재그로 칠까","body":["여름 밤하늘을 가르는 번개를 보면 자를 대고 그은 직선이 아니라 여러 갈래로 꺾인 나뭇가지 모양을 하고 있다. 두 점 사이 최단 거리는 직선인데, 전기는 왜 굳이 돌아가는 길을 택할까. 답은 공기가 전기를 잘 통하지 않는 절연체라는 사실에서 시작한다.","구름 아래쪽에 음전하가 잔뜩 쌓이면 땅과의 사이에 강한 전기장이 걸린다. 하지만 공기는 쉽게 전기를 흘려보내지 않아서, 전기장이 어느 문턱을 넘어야만 공기 분자가 이온화되며 좁은 통로가 뚫린다. 이 통로를 계단선도(stepped leader)라 부르며, 한 번에 수십 미터씩 툭툭 끊어 내려온다. 공기의 습도, 먼지, 밀도가 조금씩 다른 탓에 다음 걸음이 뻗을 방향은 매번 가장 뚫기 쉬운 쪽으로 정해진다.","가장 뚫기 쉬운 방향은 구름과 땅을 잇는 정확한 직선과 대체로 어긋난다. 그래서 선도는 걸음마다 방향을 조금씩 틀고, 그 궤적이 쌓여 지그재그가 된다. 갈라진 곁가지들이 보이는 까닭도 같다. 여러 후보 통로가 동시에 뻗다가 그중 하나가 먼저 땅에 닿는 순간, 거기로 거대한 전류가 되돌아 올라가며(귀환뇌격) 우리가 보는 밝은 섬광이 터진다.","이렇게 저항이 가장 작은 길을 더듬어 뻗는 무작위한 가지 모양은 번개만의 것이 아니다. 겨울 유리창에 어는 성에, 마른 강바닥의 갈라진 금, 마당의 지류를 거느린 강줄기도 비슷한 나뭇가지 무늬를 그린다. 조건이 균일하지 않은 매질에서 무언가가 가장 약한 지점을 골라 퍼져 나갈 때 자연이 즐겨 쓰는 형태다."],"think":"번개가 매번 다른 모양으로 치는데도 우리가 그것을 한눈에 번개라고 알아보는 이유는 무엇일까."},
  {"field":"심리학","title":"왜 우리는 착시를 알면서도 피할 수 없을까","body":["뮐러리어 착시를 떠올려 보자. 양 끝에 화살표가 안쪽으로 꺾인 선분과 바깥쪽으로 벌어진 선분을 나란히 두면, 둘의 길이가 똑같은데도 벌어진 쪽이 더 길어 보인다. 자로 재서 길이가 같다는 것을 확인한 뒤에도, 다시 눈을 돌리면 여전히 한쪽이 길게 보인다. 사실을 알아도 착시는 사라지지 않는다.","이 완고함은 뇌가 이미지를 만드는 방식에서 나온다. 눈이 받는 정보는 망막에 맺힌 2차원 빛의 무늬일 뿐이고, 뇌는 이 불완전한 자료로부터 3차원 세계를 거꾸로 추론한다. 이때 뇌는 오랜 경험에서 굳어진 규칙을 자동으로 적용한다. 안쪽으로 꺾인 화살표는 가까운 모서리, 바깥으로 벌어진 화살표는 먼 구석처럼 해석되고, 멀리 있다고 판단된 선분은 실제보다 길게 보정된다. 이 처리는 의식 아래에서 순식간에 끝나므로, '길이가 같다'는 지식이 개입할 틈이 없다.","여기서 핵심은 시각을 담당하는 부분과 판단을 담당하는 부분이 나뉘어 있다는 점이다. 지식은 앞이마 쪽 사고 영역에 저장되지만, 착시는 뒤통수 쪽 시각 처리 영역에서 이미 완성되어 올라온다. 심리학에서는 이렇게 지식으로 되돌려 고칠 수 없는 자동 처리를 인지적으로 관통 불가능하다고 부른다. 아는 것과 보이는 것이 서로 다른 창구에서 만들어지기 때문에, 하나가 다른 하나를 덮어쓰지 못한다.","같은 완고함은 눈 밖에서도 나타난다. 흰 옷이 아침 햇빛 아래서든 형광등 아래서든 흰색으로 보이는 색채 항상성, 배경에 따라 회색 조각의 밝기가 달라 보이는 명도 대비가 모두 같은 자동 보정의 산물이다. 판단의 영역으로 넘어가면 앵커링이나 확증 편향처럼, 틀린 줄 알면서도 첫 정보에 끌려가는 사고의 착시도 있다. 뇌는 매번 진실을 재확인하기보다 빠르고 그럴듯한 답을 먼저 내놓도록 만들어졌고, 착시는 그 효율의 대가로 남는 흔적이다."],"think":"눈이 만드는 세계와 내가 아는 세계가 끝내 겹치지 않는다면, 나는 둘 중 무엇을 믿고 살아가고 있는 걸까."},
  {"field":"심리학","title":"왜 기억은 볼 때마다 조금씩 달라질까","body":["어릴 적 놀이터를 떠올려 본다. 미끄럼틀 색깔, 옆에 있던 친구, 그날의 날씨까지 선명하게 그려진다. 그런데 오래된 사진을 우연히 찾아보면 미끄럼틀은 파란색이 아니라 빨간색이었고, 그 친구는 그 자리에 있지도 않았다. 기억이 카메라 영상처럼 저장된 것이라면 이런 어긋남은 생기지 않아야 한다.","뇌는 사건을 하나의 완성된 영상 파일로 보관하지 않는다. 어떤 장면은 소리, 색, 감정, 장소 같은 조각으로 나뉘어 뇌의 여러 부위에 흩어져 저장된다. 무언가를 떠올린다는 것은 저장된 파일을 재생하는 일이 아니라, 흩어진 조각을 다시 불러 모아 그 순간에 하나의 장면으로 새로 조립하는 일에 가깝다. 조립 과정에서 빠진 조각은 지금의 지식이나 기대로 자연스럽게 메워진다.","이렇게 다시 만들어진 기억은 저장될 때 그대로 돌아가지 않고, 떠올린 순간의 상태가 섞여 다시 저장된다. 심리학자 엘리자베스 로프터스의 실험은 사고 장면을 본 사람들에게 '부딪쳤다' 대신 '박살 났다'라는 단어로 질문하자, 실제로는 없던 깨진 유리를 봤다고 답하는 사람이 늘어난다는 것을 보여 주었다. 질문의 표현 하나가 기억을 조립하는 재료로 끼어든 결과다. 자주 떠올린 추억일수록 오히려 원본에서 멀어질 수 있는 이유이기도 하다.","이 원리는 일상 곳곳에서 모습을 드러낸다. 같은 여행을 다녀온 친구와 세부 장면이 서로 다르게 기억되어 다투는 일, 목격자의 진술이 시간이 지나며 조금씩 바뀌는 일, 여러 번 이야기한 무용담이 점점 더 극적으로 변하는 일이 그렇다. 기억이 매번 다시 만들어진다는 사실은 약점처럼 보이지만, 덕분에 뇌는 낡은 기억에 새로 배운 것을 덧대며 계속 갱신할 수 있다."],"think":"그렇다면 한 번도 다시 떠올리지 않은 기억은, 처음 모습 그대로 남아 있을까."},
  {"field":"심리학","title":"왜 우리는 구름과 콘센트에서 얼굴을 볼까","body":["화장실 타일의 얼룩, 자동차 앞모습, 전기 콘센트의 구멍 두 개와 아래쪽 홈. 이런 것들에서 사람들은 자꾸 웃거나 놀란 얼굴을 읽어낸다. 실제로는 점과 선이 우연히 배열됐을 뿐인데도 눈, 코, 입이 거기 있다고 느낀다. 이렇게 무질서한 자극에서 익숙한 형태, 특히 얼굴을 보는 현상을 파레이돌리아(pareidolia)라 부른다.","핵심은 뇌가 얼굴을 아주 빠르고 헐겁게 판정하도록 만들어져 있다는 점이다. 사람 뇌에는 얼굴 처리에 특히 강하게 반응하는 영역인 방추상 얼굴 영역(fusiform face area)이 있고, 이곳은 정교한 사진뿐 아니라 대충 눈 둘에 입 하나 배열만 있어도 반응한다. 눈 두 개가 가로로 놓이고 그 아래 입이 오는 세 점 구도, 이 최소 조건만 갖춰지면 얼굴 회로가 먼저 켜진다. 뇌는 정확히 세느라 늦기보다 대충 빨리 알아채는 쪽을 택한다.","이런 성향은 실수가 아니라 생존에 유리한 쪽으로 기울어진 판정으로 볼 수 있다. 풀숲의 그림자를 포식자로 잘못 봐도 잠깐 놀라고 마는 데 그치지만, 진짜 포식자를 그림자로 넘겨버리면 목숨을 잃는다. 두 오류의 대가가 이렇게 다르면, 없는 얼굴을 있다고 착각하는 쪽으로 문턱을 낮춰두는 편이 안전하다. 사람 얼굴은 특히 감정과 시선의 방향까지 읽어내야 할 사회적 정보 덩어리라, 뇌가 이 방향으로 예민하게 조율됐다고 여겨진다.","같은 원리를 주변에서 흔히 확인할 수 있다. 밤하늘 별을 이어 곰이나 국자를 그리는 별자리, 달 표면 무늬에서 방아 찧는 토끼를 읽는 이야기, 잡음 섞인 녹음에서 없는 말소리를 듣는 착청이 모두 뇌가 흐릿한 입력에 익숙한 틀을 얹는 같은 습관에서 나온다. 최근에는 이미지를 학습한 인공지능도 구름 사진에서 얼굴 비슷한 패턴을 강조해 그려내는데, 이는 사람과 기계가 공통으로 '패턴을 먼저 기대하고 본다'는 점을 보여준다. 세상을 있는 그대로가 아니라 뇌가 지닌 형판에 맞춰 읽는 순간, 벽의 얼룩은 얼굴이 된다."],"think":"천장 얼룩에서 얼굴을 본 다음 날에도 같은 얼룩에서 같은 얼굴이 보인다면, 그 얼굴은 벽에 있는가 내 안에 있는가."},
  {"field":"수학","title":"왜 해바라기 씨앗은 나선으로 촘촘히 박힐까","body":["잘 여문 해바라기 꽃판을 들여다보면 씨앗들이 아무렇게나 흩어져 있지 않다. 가운데에서 바깥으로 휘감아 나가는 나선 줄기가 시계 방향과 반시계 방향 두 갈래로 겹쳐 보인다. 한쪽 나선의 개수를 세고 다른 쪽을 세면 34개와 55개, 혹은 55개와 89개처럼 이웃한 두 수가 자주 나온다. 이 수들은 앞의 두 수를 더해 다음 수를 만드는 피보나치 수열의 항이다.","씨앗이 이렇게 배열되는 까닭은 꽃의 생장점에서 새 씨앗이 하나씩 돋을 때 이전 씨앗과 일정한 각도만큼 돌아가며 자리를 잡기 때문이다. 그 각도가 약 137.5도, 이른바 황금각이다. 원 둘레를 두 호의 길이 비가 황금비가 되도록 나눌 때 생기는 작은 쪽 호에 해당한다. 씨앗이 매번 이 각만큼 회전하며 바깥으로 밀려나면 어느 씨앗도 앞선 씨앗과 정확히 겹치는 방향에 놓이지 않는다.","왜 하필 이 각도가 촘촘한 배열을 만드는지는 나눗셈으로 짐작할 수 있다. 회전각이 360도의 단순한 분수배, 예컨대 정확히 5분의 1이면 다섯 번째마다 씨앗이 같은 방향에 겹쳐 다섯 갈래 빈 줄이 생긴다. 황금비는 어떤 분수로도 깔끔하게 근사되지 않는 무리수라, 씨앗들이 한 방향으로 몰리지 않고 빈틈을 고르게 메운다. 그 결과로 눈에 드러나는 나선의 개수가 피보나치 수로 떨어진다.","같은 규칙은 해바라기에만 갇혀 있지 않다. 솔방울의 비늘, 파인애플 껍질의 육각 무늬, 선인장 가시가 도는 줄, 데이지나 국화의 낱꽃 배열에서도 겹나선과 피보나치 수가 되풀이해 나타난다. 식물이 수학을 알고 배치하는 것이 아니라, 좁은 공간에 잎이나 씨앗을 겹치지 않게 채우려는 생장 과정이 자연히 이 각도로 수렴한 결과로 보인다. 익숙한 꽃 한 송이가 실은 오래된 수 규칙의 전시장이다."],"think":"만약 씨앗이 황금각 대신 딱 90도씩 돌며 돋았다면, 꽃판은 어떤 무늬로 채워졌을까."},
  {"field":"심리학","title":"첫인상은 왜 바꾸기 어려울까","body":["처음 만난 사람을 몇 초 안에 '괜찮은 사람' 또는 '별로인 사람'으로 분류해 본 경험은 누구에게나 있다. 심리학 연구들은 사람이 얼굴을 본 지 0.1초 정도의 짧은 시간에 신뢰감이나 호감 같은 판단을 내린다고 보고한다. 문제는 이 빠른 판단이 나중에 다른 정보를 만나도 좀처럼 흔들리지 않는다는 점이다. 한 번 '이 사람은 무례하다'고 정해 놓으면, 그 뒤의 행동도 그 틀에 맞춰 해석되기 쉽다.","여기에는 확증편향(confirmation bias)이라는 사고 습관이 깔려 있다. 사람은 자기가 이미 믿는 것을 뒷받침하는 정보에는 눈이 밝고, 반대되는 정보는 흘려보내거나 예외로 처리한다. 첫인상이 '차갑다'였다면, 그 사람이 웃어도 '억지웃음'으로 읽고 무표정하면 '역시 차갑다'로 읽는다. 어느 쪽이든 처음의 결론이 강해지기만 하는 구조다.","왜 뇌가 이렇게 작동하는지는 처리 부담과 관련이 있다. 세상의 모든 정보를 매번 새로 따지면 판단이 너무 느리고 지치기 때문에, 뇌는 이미 만들어 둔 인상을 일종의 지름길로 삼는다. 또 한 번 내린 판단을 뒤집는 일은 '내가 틀렸다'는 불편함을 부르기 때문에, 사람은 대체로 기존 판단을 유지하는 쪽을 편하게 여긴다. 이 두 가지가 겹치면 첫인상은 쉽게 굳는다.","같은 원리는 일상 곳곳에서 보인다. 좋아하는 정치인의 실수는 사정이 있었다고 넘어가고 싫어하는 쪽의 실수는 본색이라고 못박는 태도, 별점 하나에 맞춰 나머지 후기를 골라 읽는 습관이 그렇다. 첫인상을 완전히 없애기는 어렵지만, '내가 지금 반대 증거를 빼놓고 보는 건 아닌가'라고 한 번 물어보는 것만으로도 굳어진 틀에 작은 틈을 낼 수 있다."],"think":"내가 어떤 사람을 오래 오해했다가 뒤늦게 바꾼 판단은, 무엇이 그 틀을 깨뜨렸던 걸까."}
];

/* ================= 날짜 / 저장 ================= */
const START = new Date(2026, 6, 22); // 2026-07-22 = DAY 1
const KEY = "haru_v2";
const DAYS = Math.min(SCI.length, JP.length);

function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayIndex(){ return Math.floor((midnight(new Date()) - midnight(START)) / 86400000); }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {records:{}}; } catch(e){ return {records:{}}; } }
function save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }

let state = load();
const REAL = todayIndex();
let view = Math.min(Math.max(REAL, 0), DAYS - 1);

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================= 통계 ================= */
function renderStats(){
  const recs = state.records;
  let sci = 0, jp = 0;
  Object.keys(recs).forEach(k => { if(recs[k].sci) sci++; if(recs[k].jp) jp++; });
  let streak = 0;
  for (let i = REAL; i >= 0; i--){ if (recs[i] && recs[i].sci && recs[i].jp) streak++; else break; }
  document.getElementById("stStreak").textContent = streak;
  document.getElementById("stSci").textContent = sci;
  document.getElementById("stJp").textContent = jp;
}

/* ================= 렌더 ================= */
function renderHeader(){
  document.getElementById("dayLabel").textContent = "DAY " + String(view+1).padStart(3,"0");
  const d = new Date(midnight(START).getTime() + view*86400000);
  let label = d.toLocaleDateString("ko-KR", {month:"long", day:"numeric", weekday:"long"});
  if (view === REAL) label += " · 오늘";
  document.getElementById("dateLabel").textContent = label;
}

function sciCard(it, rec){
  let h = '<div class="seclabel" style="color:var(--accent)">오늘의 과학</div>';
  h += '<article class="card">';
  h += '<span class="tag">'+esc(it.field)+'</span>';
  h += '<h2 class="fact-title">'+esc(it.title)+'</h2>';
  h += '<div class="fact-body">'+ it.body.map(p=>'<p>'+esc(p)+'</p>').join('') +'</div>';
  h += '<div class="think"><b>🤔 생각해볼 거리</b><br>'+esc(it.think)+'</div>';
  h += '<button class="readbtn'+(rec&&rec.sci?' done':'')+'" data-kind="sci">'+(rec&&rec.sci?'✓ 읽음':'다 읽었어요')+'</button>';
  h += '</article>';
  return h;
}

function jpCard(it, rec){
  let h = '<div class="seclabel" style="color:var(--clay-deep)">오늘의 일본어</div>';
  h += '<article class="card jp">';
  h += '<span class="tag clay">'+esc(it.level)+'</span>';
  h += '<div class="jp-word"><span class="kanji">'+esc(it.word)+'</span><span class="read">'+esc(it.read)+'</span><span class="mean">'+esc(it.mean)+'</span></div>';
  h += '<div class="jp-block"><h4>한자 풀이</h4><div class="hanja">'+esc(it.hanja)+'<span class="arrow">→ '+esc(it.hanjaNote)+'</span></div></div>';
  h += '<div class="jp-block"><h4>품사 · 활용</h4><ul class="forms">';
  it.forms.forEach(f=>{ h += '<li><span class="role">'+esc(f.role)+'</span><span class="k">'+esc(f.k)+'</span><span class="r">'+esc(f.r)+'</span><span class="m">'+esc(f.m)+'</span></li>'; });
  h += '</ul></div>';
  h += '<div class="jp-block"><h4>일상 문장 5</h4><ul class="sents">';
  it.sents.forEach(s=>{ h += '<li><span class="jpt">'+esc(s.jp)+'</span><span class="rdt">'+esc(s.r)+'</span><span class="kot">'+esc(s.ko)+'</span></li>'; });
  h += '</ul></div>';
  h += '<button class="readbtn'+(rec&&rec.jp?' done':'')+'" data-kind="jp">'+(rec&&rec.jp?'✓ 배웠어요':'다 배웠어요')+'</button>';
  h += '</article>';
  return h;
}

function renderStage(){
  const stage = document.getElementById("stage");
  if (REAL >= DAYS && view === REAL){
    stage.innerHTML = '<div class="empty"><div style="font-size:26px;margin-bottom:8px;">🌱</div>준비된 조각을 모두 만났어요.<br>새 이야기가 채워지면 다시 찾아와 주세요.</div>';
    document.getElementById("allDone").classList.remove("show");
    return;
  }
  const rec = state.records[view];
  stage.innerHTML = sciCard(SCI[view], rec) + jpCard(JP[view], rec);
  stage.querySelectorAll(".readbtn").forEach(b=>{
    b.addEventListener("click", ()=> toggleRead(b.dataset.kind));
  });
  updateAllDone();
}

function toggleRead(kind){
  const r = state.records[view] || {sci:false, jp:false};
  r[kind] = !r[kind];
  state.records[view] = r;
  save(state);
  renderStage();
  renderStats();
}

function updateAllDone(){
  const r = state.records[view];
  const el = document.getElementById("allDone");
  if (r && r.sci && r.jp) el.classList.add("show"); else el.classList.remove("show");
}

/* ================= 내비 ================= */
function refresh(){ renderHeader(); renderStats(); renderStage(); syncNav(); }
function syncNav(){
  document.getElementById("prevBtn").disabled = view <= 0;
  document.getElementById("nextBtn").disabled = view >= DAYS - 1;
}
document.getElementById("prevBtn").addEventListener("click", ()=>{ if(view>0){ view--; refresh(); } });
document.getElementById("nextBtn").addEventListener("click", ()=>{ if(view<DAYS-1){ view++; refresh(); } });

refresh();
</script>
