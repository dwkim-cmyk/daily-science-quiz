<title>하루 한 조각 · 과학과 일본어</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ground: #E9EDE3;
    --paper: #F5F7EF;
    --ink: #1B322B;
    --ink-soft: #4A5D53;
    --accent: #1F7A4D;        /* 과학 = 에메랄드 */
    --accent-deep: #163B29;
    --clay: #B25534;          /* 일본어 = 클레이 */
    --clay-deep: #8A3F26;
    --line: rgba(27, 50, 43, 0.10);
    --grid: rgba(27, 50, 43, 0.045);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    --jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", var(--sans);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--ground);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 500px; margin: 0 auto; padding: 0 18px 52px; }

  header {
    background: var(--accent-deep);
    color: var(--paper);
    margin: 0 -18px;
    padding: 26px 22px 22px;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em;
    text-transform: uppercase; color: rgba(245,247,239,0.6);
    margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .eyebrow .day { color: var(--paper); font-size: 13px; letter-spacing: 0.14em; }
  header h1.brand { margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -0.01em; }
  header .date { font-family: var(--mono); font-size: 13px; color: rgba(245,247,239,0.68); margin-top: 6px; }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; margin: 18px 0 8px;
  }
  .stat { background: var(--paper); padding: 12px 8px 11px; text-align: center; }
  .stat .num { font-family: var(--mono); font-size: 21px; font-weight: 600; color: var(--accent); line-height: 1.1; }
  .stat .lab { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

  .daynav {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 4px 0 2px;
  }
  .navbtn {
    font-family: inherit; font-size: 12.5px; color: var(--ink-soft);
    background: none; border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 12px; cursor: pointer; transition: background .15s, color .15s;
  }
  .navbtn:hover:not(:disabled) { background: rgba(31,122,77,0.07); color: var(--accent); }
  .navbtn:disabled { opacity: 0.32; cursor: default; }
  .navnow { font-size: 11.5px; color: var(--ink-soft); text-align: center; flex: 1; }
  .navnow.review { color: var(--accent); font-weight: 600; }

  .seclabel {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-soft); margin: 28px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .seclabel::before { content: ""; width: 16px; height: 2px; background: currentColor; opacity: 0.5; }

  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 18px; padding: 24px 22px 22px;
  }
  .card.jp { border-color: rgba(178,85,52,0.28); }

  .tag {
    display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    color: var(--accent); background: rgba(31,122,77,0.10); border: 1px solid rgba(31,122,77,0.22);
    padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
  }
  .tag.clay { color: var(--clay-deep); background: rgba(178,85,52,0.10); border-color: rgba(178,85,52,0.26); }

  .fact-title { font-size: 22px; font-weight: 750; line-height: 1.35; margin: 0 0 14px; letter-spacing: -0.01em; }
  .fact-body p { font-size: 16px; color: #263a32; margin: 0 0 13px; }
  .fact-body p:last-child { margin-bottom: 0; }

  .think {
    margin-top: 18px; padding: 13px 15px; background: rgba(31,122,77,0.07);
    border-radius: 12px; font-size: 14.5px; color: #2c4a3c;
  }
  .think b { color: var(--accent); font-weight: 700; }

  .jp-word { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .jp-word .kanji { font-family: var(--jp); font-size: 40px; font-weight: 700; line-height: 1.1; }
  .jp-word .read { font-family: var(--jp); font-size: 16px; color: var(--clay-deep); }
  .jp-word .mean { font-size: 17px; color: var(--ink-soft); }

  .jp-block { margin-top: 18px; }
  .jp-block h4 {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--clay-deep); margin: 0 0 9px; font-weight: 600;
  }
  .hanja { font-size: 15px; color: #3a4a42; }
  .hanja .arrow { display: block; margin-top: 4px; color: var(--ink-soft); }

  .forms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .forms li { font-size: 14.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .forms .k { font-family: var(--jp); font-weight: 600; }
  .forms .r { font-family: var(--jp); font-size: 12.5px; color: var(--clay-deep); }
  .forms .m { color: var(--ink-soft); }
  .forms .role { font-size: 11px; color: var(--ink-soft); font-family: var(--mono); min-width: 62px; }

  .sents { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
  .sents li { position: relative; padding-left: 26px; }
  .sents li::before {
    counter-increment: s; content: counter(s); position: absolute; left: 0; top: 1px;
    font-family: var(--mono); font-size: 11px; color: #fff; background: var(--clay);
    width: 18px; height: 18px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  }
  .sents .jpt { font-family: var(--jp); font-size: 16px; font-weight: 500; display: block; }
  .sents .rdt { font-family: var(--jp); font-size: 13px; color: var(--clay-deep); display: block; margin-top: 2px; }
  .sents .kot { font-size: 14px; color: var(--ink-soft); display: block; margin-top: 3px; }

  .readbtn {
    margin-top: 20px; width: 100%; font-family: var(--sans); font-size: 15px; font-weight: 600;
    background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
    border-radius: 12px; padding: 12px; cursor: pointer; transition: background .15s, color .15s;
  }
  .readbtn:hover { background: rgba(31,122,77,0.08); }
  .readbtn.done { background: var(--accent); color: #fff; }
  .card.jp .readbtn { color: var(--clay-deep); border-color: var(--clay); }
  .card.jp .readbtn:hover { background: rgba(178,85,52,0.08); }
  .card.jp .readbtn.done { background: var(--clay); color: #fff; }

  .alldone { margin: 24px 0 0; text-align: center; font-size: 14.5px; color: var(--ink-soft); display: none; }
  .alldone.show { display: block; animation: rise .4s ease both; }
  .alldone b { color: var(--accent); }
  @keyframes rise { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce) { .alldone.show { animation: none; } .readbtn { transition: none; } }

  .empty {
    background: var(--paper); border: 1px dashed var(--line); border-radius: 18px;
    padding: 40px 24px; text-align: center; color: var(--ink-soft);
  }
</style>

<div class="app">
  <header>
    <p class="eyebrow"><span>오늘의 한 조각</span><span class="day" id="dayLabel">DAY 001</span></p>
    <h1 class="brand">하루 한 조각</h1>
    <div class="date" id="dateLabel">—</div>
  </header>

  <section class="stats">
    <div class="stat"><div class="num" id="stStreak">0</div><div class="lab">연속일</div></div>
    <div class="stat"><div class="num" id="stSci">0</div><div class="lab">읽은 과학</div></div>
    <div class="stat"><div class="num" id="stJp">0</div><div class="lab">배운 단어</div></div>
  </section>

  <nav class="daynav">
    <button id="prevBtn" class="navbtn">◀ 지난 학습</button>
    <span class="navnow" id="navNow"></span>
    <button id="nextBtn" class="navbtn">다음 날 ▶</button>
  </nav>

  <main id="stage"></main>
  <div class="alldone" id="allDone">오늘 몫을 다 읽었어요 · <b>내일 또 만나요</b></div>
</div>

<script>
/* ================= 콘텐츠 재고 ================= */
const SCI = [
  {
    "field": "지구과학",
    "title": "왜 눈송이는 육각형일까",

      "모양은 그 눈송이가 지나온 온도와 습도에 따라 달라집니다. 이 관계를 처음 지도로 그린 사람이 일본 물리학자 나카야 우키치로입니다. 영하 2도 부근에서는 납작한 육각 판이, 영하 5도 부근에서는 길쭉한 기둥이, 영하 15도 부근에서는 우리가 흔히 떠올리는 별 모양 가지가 나타납니다. 그는 \"눈은 하늘이 보낸 편지\"라는 말을 남겼는데, 눈송이 모양만 읽어도 그것이 지나온 하늘의 사정을 되짚을 수 있다는 뜻이었습니다.",
      "신기하게도 여섯 갈래는 서로 똑 닮았습니다. 이유는 생각보다 단순합니다. 여섯 갈래는 하나의 결정으로 연결되어 있어서, 떨어지는 동안 같은 온도와 습도 변화를 동시에 겪습니다. 조건이 바뀌면 여섯 방향이 나란히 같은 방식으로 반응하기 때문에 닮은꼴로 자랍니다. 서로 맞춘 것이 아니라 같은 환경을 함께 겪었기 때문입니다.",
      "반대로 눈송이 하나하나는 모두 다릅니다. 갈래는 여섯뿐이지만 결정이 지나는 온도와 습도의 조합은 셀 수 없을 만큼 다양하기 때문입니다. 그래서 똑같은 눈송이 두 개가 나올 가능성은 거의 없습니다. 미국의 윌슨 벤틀리는 1885년부터 현미경에 카메라를 붙여 눈송이 사진을 5천 장 넘게 찍었는데, 그중 똑같은 것은 단 한 쌍도 없었습니다.",
      "이 육각 얼음은 눈송이 밖에서도 볼 수 있습니다. 겨울 유리창에 돋는 성에, 냉동실 벽에 끼는 서리가 모두 같은 결정입니다. 결국 눈송이의 육각형은 물 분자 하나의 각도가 하늘 규모로 커진 모습이라고 볼 수 있습니다. 눈 한 송이에는 그것이 지나온 하늘의 온도와 습도가 고스란히 담겨 있습니다."
    ],
    "think": "아주 추운 날 내린 눈이 잘 뭉쳐지지 않고 보송보송한 것도, 결정 모양과 관계가 있을까?"

  {
    "field": "생물",
    "title": "문어는 왜 심장이 3개일까",
    "body": [
      "문어를 해부하면 심장이 세 개나 뜁니다. 둘은 좌우 아가미에 하나씩 붙어 아가미로 피를 밀어 넣는 아가미 심장이고, 나머지 하나는 산소를 받은 피를 온몸으로 내보내는 중심 심장입니다. 피는 먼저 두 아가미 심장에 밀려 아가미에서 산소를 싣고, 그 피가 중심 심장에 모여 다시 온몸으로 퍼집니다. 피를 두 번에 나눠 보내는 구조로, 심장 하나로 온몸을 도는 우리 몸과는 꽤 다릅니다.",

      "이 파란 색소에는 약점이 있습니다. 헤모시아닌은 헤모글로빈보다 산소를 붙드는 힘이 약합니다. 같은 부피의 피가 실어 나르는 산소의 양이 그만큼 적다는 뜻입니다. 게다가 적혈구 같은 세포에 담기지 않고 피의 액체 성분에 그대로 녹아 떠다녀서, 산소를 붙잡는 효율에서도 손해를 봅니다.",

      "이 순환 방식에는 뚜렷한 약점이 하나 있습니다. 문어가 빨아들인 물을 깔때기로 세차게 뿜어 제트처럼 헤엄칠 때, 그 압력 때문에 중심 심장이 일시적으로 제대로 뛰지 못합니다. 온몸으로 피를 보내는 펌프가 멈추니 산소 공급이 끊기고, 문어는 몇 번 뿜지 않아 금세 지칩니다.",
      "그래서 문어는 물을 뿜어 내달리기보다 여덟 개의 팔로 바닥을 기어 다니기를 훨씬 좋아합니다. 쫓길 때 물을 왈칵 뿜어 튀어 달아나기도 하지만, 그 속도는 오래가지 못합니다. 먹물을 뿜고 몸빛을 바꾸는 위장술이 발달한 것도, 오래 달릴 수 없는 몸의 한계를 다른 능력으로 보완하게 된 것입니다."

  {

      "모든 물체는 자기 질량으로 주위를 끌어당깁니다. 작은 돌멩이의 중력은 너무 약해서 바위를 이루는 원자들의 결합을 이기지 못하므로, 돌은 깨진 그대로 각진 모양을 오래 유지합니다. 그러나 질량이 충분히 커지면 중력이 모든 방향에서 중심을 향해 똑같이 잡아당겨, 튀어나온 부분은 끌려 내려가고 움푹한 부분은 채워지며 마침내 구가 만들어집니다. 천문학자들은 중력과 물질의 버티는 힘이 팽팽히 맞아 더는 모양이 흐르지 않는 이 상태를 정유체 평형(hydrostatic equilibrium)이라 부릅니다. 바위는 물이 아니어서 이 흐름은 수억 년에 걸쳐 아주 천천히 일어나지만, 시간이 넉넉한 우주에서는 결국 둥근 결말에 다다릅니다.",
      "이 경계가 되는 크기는 대략 지름 수백 킬로미터입니다. 단단한 바위질 천체는 지름 600킬로미터 안팎은 되어야 스스로의 중력으로 둥글어지고, 얼음처럼 무른 물질로 된 천체는 그보다 작아도 둥글어집니다. 지름 약 400킬로미터인 토성의 위성 미마스는 표면에 제 지름의 삼분의 일에 이르는 거대한 허셜 충돌구를 이고도 거의 완벽한 공 모양인 반면, 지름 20여 킬로미터인 화성의 위성 포보스는 감자처럼 찌그러진 채로 남아 있습니다. 둘의 운명을 가른 것은 재료가 아니라 크기, 곧 스스로 끌어당기는 중력의 세기였습니다.",
      "이 문턱 부근에 걸친 천체들은 특히 흥미롭습니다. 소행성대에서 두 번째로 큰 베스타는 지름이 500킬로미터를 넘지만 남극에 파인 거대한 충돌구 탓에 아직 완전한 구가 되지 못했고, 소행성대에서 가장 큰 세레스는 지름이 약 940킬로미터에 이르러 매끈한 공 모양을 이루었습니다. 미국 항공우주국(NASA)의 던(Dawn) 탐사선은 2011년 베스타를, 2015년 세레스를 차례로 돌며 이 대비를 눈앞에서 확인해 주었습니다. 천체가 스스로의 중력으로 둥글어질 만큼 자랐는가는, 왜소행성과 그저 큰 바위덩어리를 가르는 기준의 하나이기도 합니다.",
      "그러나 둥글다고 해서 완벽한 구는 아닙니다. 빠르게 자전하는 별과 행성은 적도 쪽이 원심력에 밀려 바깥으로 부풀어, 위아래로 살짝 눌린 공, 곧 편구(oblate spheroid)가 됩니다. 지구가 정확히 그런데, 적도 지름이 극 지름보다 약 43킬로미터 더 깁니다. 아이작 뉴턴은 1687년 지구가 자전 때문에 적도가 부푼 모양일 수밖에 없다고 예측했으나 프랑스의 카시니 가문은 오히려 지구가 세로로 길쭉하다고 맞섰고, 논쟁은 결국 측량으로 판가름 났습니다. 1730년대에 모페르튀이가 이끈 팀은 북극에 가까운 라플란드로, 라콩다민이 이끈 팀은 적도의 페루로 떠나 위도 1도의 거리를 쟀는데, 라플란드에서 잰 1도가 페루에서 잰 1도보다 길게 나와 뉴턴의 손을 들어 주었습니다.",
      "자전이 빠를수록 배는 더 나옵니다. 목성은 지름이 지구의 열 배가 넘는 몸집을 열 시간이 채 안 되어 한 바퀴 돌리는 탓에 망원경으로도 옆으로 퍼져 보이고, 토성은 태양계 행성 가운데 가장 납작합니다. 반대로 중력이 극단으로 강해지면 어떤 울퉁불퉁함도 살아남지 못하는데, 태양보다 무거운 질량을 지름 20킬로미터 남짓한 공간에 욱여넣은 중성자별은 산이 솟아도 높이가 겨우 밀리미터에 그쳐 우주에서 가장 완벽에 가까운 구로 꼽힙니다. 태양처럼 크지만 스물닷새에 한 바퀴를 돌 만큼 느린 천체는 원심력이 작아 거의 흠 없는 공에 머뭅니다. 결국 행성과 별이 둥근 까닭은 우연이 아니라 중력이 충분히 커졌을 때 반드시 도달하는 결론이며, 그 위에 자전이 얹혀 적도를 밀어내면 저마다의 얼굴이 완성됩니다."
    ],
    "think": "원문 4문단의 핵심 사실(중력이 큰 질량에서 물질 강도를 눌러 구를 만든다, 경계 크기 수백 km, 미마스 대 포보스, 왜소행성 기준, 지구 적도-극 지름차 43km, 목성 자전)은 확장본에 모두 보존됐다. 확장으로 추가된 항목을 하나씩 검증: 정유체 평형(정확한 용어), 미마스 지름 약 400km와 허셜 충돌구가 지름의 약 1/3(139/396≈0.35, 맞음), 포보스 지름 20여 km(맞음), 베스타 지름 500km 초과·소행성대 2위·남극 대충돌구·비평형(맞음), 세레스 지름 약 940km·소행성대 최대·구형(맞음), 던 탐사선 2011 베스타·2015 세레스(맞음), 뉴턴 1687 예측·카시니 가문 세로 길쭉 주장(맞음), 토성이 태양계에서 가장 납작·적도-극 반지름차 수천 km(약 5,900km, 맞음), 중성자별 태양질량 이상·지름 20km·산 mm 단위·가장 완벽한 구(맞음), 태양 지름 지구 100배 초과·자전 약 25일·최고 구형(맞음), 혜성 두 덩이 핵·류구(하야부사2)·베누(오시리스렉스) 팽이꼴(맞음). 두 곳에서 오류를 잡았다. 첫째, 8문단의 위도 1도 측량 논리가 정반대로 서술됐다: 극에서 눌린 편구는 평평한 극 근처에서 1도가 더 길게 나오고, 실제 라플란드(극) 1도가 페루(적도) 1도보다 길게 나와 뉴턴이 옳음을 확인한 것이다. 원문은 \"적도 쪽 1도가 더 길면 그곳이 부푼 것\"이라 했는데 이는 명백히 뒤집힌 서술이라 교정했다. 둘째, 중성자별 표면중력을 지구의 \"수십억 배\"라 했으나 실제 약 2×10^11배로 약 100~200배 과소평가되어 \"수천억 배\"로 고쳤다."

  {
    "field": "천문학",

    "body": [
      "망원경으로 본 토성의 고리는 넓고 화려하지만, 그 두께는 놀랄 만큼 얇습니다. 바깥 가장자리까지 재면 지름이 대략 27만 킬로미터에 이르러, 지구와 달 사이 거리의 절반을 훌쩍 넘습니다. 그런데 이 거대한 원반의 두께는 대부분 구간에서 겨우 10미터 안팎에 지나지 않습니다. 태양계에서 가장 눈에 띄는 구조물이 실제로는 얇은 막에 가깝습니다. 이런 납작함은 우연이 아니라 오랜 물리 과정이 빚어낸 결과입니다.",

      "알갱이들의 궤도가 조금씩 위아래로 기울어 있으면 서로 스치고 부딪칩니다. 충돌할 때마다 위아래로 튀는 움직임은 열과 잔부스러기로 흩어져 사라지지만, 토성을 도는 수평 방향의 움직임은 각운동량 보존 때문에 쉽게 없어지지 않습니다. 그래서 충돌을 거듭할수록 위아래 운동만 깎여 나가고, 알갱이들은 점점 하나의 평면으로 눌려 모입니다. 이렇게 평평해진 상태는 에너지가 가장 낮은 배치에 가깝습니다. 여기에 토성 자체도 빠른 자전 탓에 적도가 불룩한 타원체여서, 그 부푼 적도의 중력이 알갱이 궤도를 적도면 쪽으로 끌어당겨 원반이 한 평면을 유지하도록 붙듭니다.",
      "이 얇음은 오래전부터 사람을 헷갈리게 했습니다. 1610년 갈릴레오는 손수 만든 망원경으로 토성을 겨누고 양옆에 손잡이 같은 것이 붙었다고 적었는데, 몇 해 뒤 고리가 옆면을 보이는 시기가 오자 그 손잡이가 사라져 몹시 당황했습니다. 1655년 네덜란드의 하위헌스가 토성을 얇은 고리가 둘러싸고 있다고 처음 제안했고, 뒤이어 카시니는 고리 사이에 검은 틈이 있음을 알아냈습니다. 이 틈은 오늘날 카시니 간극이라 불립니다. 1859년 스코틀랜드의 물리학자 맥스웰은 고리가 단단한 판이라면 회전하며 부서질 수밖에 없음을 계산으로 보이고 무수한 작은 알갱이의 무리여야 한다고 결론지었는데, 이 업적으로 애덤스상을 받았고 뒷날 카시니 탐사선이 그의 계산이 옳았음을 확인했습니다.",

  {"level":"N3","word":"予約","read":"よやく","mean":"예약","hanja":"予 미리 예 + 約 맺을 약","hanjaNote":"미리(予) 약속을 맺어(約) 자리나 서비스를 정해 두는 것이다.","forms":[{"role":"명사","k":"予約","r":"よやく","m":"예약"},{"role":"する동사","k":"予約する","r":"よやくする","m":"예약하다"},{"role":"관용표현","k":"予約を取る","r":"よやくをとる","m":"예약을 잡다"},{"role":"관용표현","k":"予約をキャンセルする","r":"よやくをキャンセルする","m":"예약을 취소하다"},{"role":"파생어","k":"予約席","r":"よやくせき","m":"예약석"}],"sents":[{"jp":"レストランを予約しておきました。","r":"レストラン を よやく して おきました。","ko":"레스토랑을 예약해 두었습니다."},{"jp":"ネットで新幹線の予約を取りました。","r":"ネット で しんかんせん の よやく を とりました。","ko":"인터넷으로 신칸센 예약을 잡았습니다."},{"jp":"すみません、予約をキャンセルしたいのですが。","r":"すみません、 よやく を キャンセル したい の です が。","ko":"죄송하지만, 예약을 취소하고 싶은데요."},{"jp":"人気の店なので予約は必須です。","r":"にんき の みせ な ので よやく は ひっす です。","ko":"인기 있는 가게라서 예약은 필수입니다."},{"jp":"予約の時間に遅れないでください。","r":"よやく の じかん に おくれない で ください。","ko":"예약 시간에 늦지 말아 주세요."}]},
  {"level":"N3","word":"招待","read":"しょうたい","mean":"초대","hanja":"招 부를 초 + 待 기다릴 대","hanjaNote":"사람을 불러(招) 오기를 기다린다(待)는 뜻으로, 손님으로 청해 맞이하는 것이다.","forms":[{"role":"명사","k":"招待","r":"しょうたい","m":"초대"},{"role":"する동사","k":"招待する","r":"しょうたいする","m":"초대하다"},{"role":"명사","k":"招待状","r":"しょうたいじょう","m":"초대장"},{"role":"명사","k":"招待客","r":"しょうたいきゃく","m":"초대 손님"},{"role":"수동형","k":"招待される","r":"しょうたいされる","m":"초대받다"}],"sents":[{"jp":"友達の結婚式に招待されました。","r":"ともだち の けっこんしき に しょうたい されました。","ko":"친구 결혼식에 초대받았어요."},{"jp":"今度の誕生日パーティーにあなたを招待したいです。","r":"こんど の たんじょうび パーティー に あなた を しょうたい したい です。","ko":"이번 생일 파티에 당신을 초대하고 싶어요."},{"jp":"招待状はもう届きましたか。","r":"しょうたいじょう は もう とどきました か。","ko":"초대장은 벌써 도착했나요?"},{"jp":"パーティーには大勢の招待客が来ました。","r":"パーティー に は おおぜい の しょうたいきゃく が きました。","ko":"파티에는 많은 초대 손님이 왔어요."},{"jp":"招待してくれてありがとう。","r":"しょうたい して くれて ありがとう。","ko":"초대해 줘서 고마워."}]},
  {"level":"N3","word":"相談","read":"そうだん","mean":"상담·의논","hanja":"相 서로 상 + 談 말씀 담","hanjaNote":"서로(相) 말(談)을 주고받으며 함께 문제를 의논하는 것이다.","forms":[{"role":"명사","k":"相談","r":"そうだん","m":"상담, 의논"},{"role":"する동사","k":"相談する","r":"そうだんする","m":"상담하다, 의논하다"},{"role":"관용표현","k":"相談に乗る","r":"そうだんにのる","m":"상담에 응해 주다, 고민을 들어 주다"},{"role":"명사","k":"相談相手","r":"そうだんあいて","m":"상담 상대, 의논할 사람"},{"role":"명사","k":"相談役","r":"そうだんやく","m":"상담역, 고문"}],"sents":[{"jp":"ちょっと相談したいことがあるんですけど、今いいですか。","r":"ちょっと そうだん したい こと が あるんです けど、いま いい です か。","ko":"잠깐 상담하고 싶은 게 있는데, 지금 괜찮으세요?"},{"jp":"進路のことで先生に相談しました。","r":"しんろ の こと で せんせい に そうだん しました。","ko":"진로 문제로 선생님께 상담했습니다."},{"jp":"悩んでいるなら、いつでも相談に乗るよ。","r":"なやんで いる なら、いつでも そうだん に のる よ。","ko":"고민하고 있으면 언제든지 상담해 줄게."},{"jp":"この件は一度みんなと相談してから決めましょう。","r":"この けん は いちど みんな と そうだん して から きめましょう。","ko":"이 건은 한번 모두와 의논하고 나서 정합시다."},{"jp":"彼はいつも私のいい相談相手になってくれる。","r":"かれ は いつも わたし の いい そうだん あいて に なって くれる。","ko":"그는 늘 내 좋은 의논 상대가 되어 준다."}]},
  {"level":"N3","word":"満足","read":"まんぞく","mean":"만족","hanja":"満 찰 만 + 足 발/족할 족","hanjaNote":"가득 차고(満) 충분하다(足)는 뜻으로, 부족함 없이 마음이 흡족하게 채워진 상태이다.","forms":[{"role":"명사","k":"満足","r":"まんぞく","m":"만족"},{"role":"する동사","k":"満足する","r":"まんぞくする","m":"만족하다"},{"role":"な형용사","k":"満足な","r":"まんぞくな","m":"만족스러운, 충분한"},{"role":"파생어","k":"不満足","r":"ふまんぞく","m":"불만족"},{"role":"관용표현","k":"自己満足","r":"じこまんぞく","m":"자기만족"}],"sents":[{"jp":"今回の結果には満足しています。","r":"こんかい の けっか に は まんぞく して います。","ko":"이번 결과에는 만족하고 있어요."},{"jp":"彼はいつも自分に満足していない。","r":"かれ は いつも じぶん に まんぞく して いない。","ko":"그는 항상 자기 자신에게 만족하지 못한다."},{"jp":"お客様に満足していただけるサービスを目指します。","r":"おきゃくさま に まんぞく して いただける サービス を めざします。","ko":"고객님이 만족하실 수 있는 서비스를 목표로 합니다."},{"jp":"この給料では満足な生活ができない。","r":"この きゅうりょう で は まんぞくな せいかつ が できない。","ko":"이 월급으로는 만족스러운 생활을 할 수 없다."},{"jp":"少し疲れたけど、旅行はとても満足だった。","r":"すこし つかれた けど、りょこう は とても まんぞく だった。","ko":"조금 피곤했지만, 여행은 아주 만족스러웠다."}]}
];

/* ================= 날짜 / 저장 ================= */
const START = new Date(2026, 6, 22); // 2026-07-22 = DAY 1
const KEY = "haru_v2";
const DAYS = Math.min(SCI.length, JP.length);

function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayIndex(){ return Math.floor((midnight(new Date()) - midnight(START)) / 86400000); }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {records:{}}; } catch(e){ return {records:{}}; } }
function save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }

let state = load();
const REAL = todayIndex();
const TOP = Math.min(Math.max(REAL, 0), DAYS - 1);  // 오늘(또는 재고 마지막) = 볼 수 있는 최신 날
let view = TOP;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================= 통계 ================= */
function renderStats(){
  const recs = state.records;
  let sci = 0, jp = 0;
  Object.keys(recs).forEach(k => { if(recs[k].sci) sci++; if(recs[k].jp) jp++; });
  let streak = 0;
  for (let i = REAL; i >= 0; i--){ if (recs[i] && recs[i].sci && recs[i].jp) streak++; else break; }
  document.getElementById("stStreak").textContent = streak;
  document.getElementById("stSci").textContent = sci;
  document.getElementById("stJp").textContent = jp;
}

/* ================= 렌더 ================= */
function renderHeader(){
  document.getElementById("dayLabel").textContent = "DAY " + String(view+1).padStart(3,"0");
  const d = new Date(midnight(START).getTime() + view*86400000);
  let label = d.toLocaleDateString("ko-KR", {month:"long", day:"numeric", weekday:"long"});
  if (view === REAL) label += " · 오늘";
  document.getElementById("dateLabel").textContent = label;
}

function sciCard(it, rec){
  let h = '<div class="seclabel" style="color:var(--accent)">오늘의 과학</div>';
  h += '<article class="card">';
  h += '<span class="tag">'+esc(it.field)+'</span>';
  h += '<h2 class="fact-title">'+esc(it.title)+'</h2>';
  h += '<div class="fact-body">'+ it.body.map(p=>'<p>'+esc(p)+'</p>').join('') +'</div>';
  h += '<div class="think"><b>🤔 생각해볼 거리</b><br>'+esc(it.think)+'</div>';
  h += '<button class="readbtn'+(rec&&rec.sci?' done':'')+'" data-kind="sci">'+(rec&&rec.sci?'✓ 읽음':'다 읽었어요')+'</button>';
  h += '</article>';
  return h;
}

function jpCard(it, rec){
  let h = '<div class="seclabel" style="color:var(--clay-deep)">오늘의 일본어</div>';
  h += '<article class="card jp">';
  h += '<span class="tag clay">'+esc(it.level)+'</span>';
  h += '<div class="jp-word"><span class="kanji">'+esc(it.word)+'</span><span class="read">'+esc(it.read)+'</span><span class="mean">'+esc(it.mean)+'</span></div>';
  h += '<div class="jp-block"><h4>한자 풀이</h4><div class="hanja">'+esc(it.hanja)+'<span class="arrow">→ '+esc(it.hanjaNote)+'</span></div></div>';
  h += '<div class="jp-block"><h4>품사 · 활용</h4><ul class="forms">';
  it.forms.forEach(f=>{ h += '<li><span class="role">'+esc(f.role)+'</span><span class="k">'+esc(f.k)+'</span><span class="r">'+esc(f.r)+'</span><span class="m">'+esc(f.m)+'</span></li>'; });
  h += '</ul></div>';
  h += '<div class="jp-block"><h4>일상 문장 5</h4><ul class="sents">';
  it.sents.forEach(s=>{ h += '<li><span class="jpt">'+esc(s.jp)+'</span><span class="rdt">'+esc(s.r)+'</span><span class="kot">'+esc(s.ko)+'</span></li>'; });
  h += '</ul></div>';
  h += '<button class="readbtn'+(rec&&rec.jp?' done':'')+'" data-kind="jp">'+(rec&&rec.jp?'✓ 배웠어요':'다 배웠어요')+'</button>';
  h += '</article>';
  return h;
}

function renderStage(){
  const stage = document.getElementById("stage");
  if (REAL >= DAYS && view === REAL){
    stage.innerHTML = '<div class="empty"><div style="font-size:26px;margin-bottom:8px;">🌱</div>준비된 조각을 모두 만났어요.<br>새 이야기가 채워지면 다시 찾아와 주세요.</div>';
    document.getElementById("allDone").classList.remove("show");
    return;
  }
  const rec = state.records[view];
  stage.innerHTML = sciCard(SCI[view], rec) + jpCard(JP[view], rec);
  stage.querySelectorAll(".readbtn").forEach(b=>{
    b.addEventListener("click", ()=> toggleRead(b.dataset.kind));
  });
  updateAllDone();
}

function toggleRead(kind){
  const r = state.records[view] || {sci:false, jp:false};
  r[kind] = !r[kind];
  state.records[view] = r;
  save(state);
  renderStage();
  renderStats();
}

function updateAllDone(){
  const r = state.records[view];
  const el = document.getElementById("allDone");
  if (r && r.sci && r.jp) el.classList.add("show"); else el.classList.remove("show");
}

/* ================= 지난 학습 내비 (과거 복습 전용, 미래 미리보기 차단) ================= */
function syncNav(){
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");
  const now = document.getElementById("navNow");
  prev.disabled = view <= 0;
  next.disabled = view >= TOP;
  if (view === TOP){
    now.textContent = "오늘 몫을 보고 있어요";
    now.classList.remove("review");
  } else {
    now.textContent = "지난 학습 다시보기 · " + (TOP - view) + "일 전";
    now.classList.add("review");
  }
}
document.getElementById("prevBtn").addEventListener("click", ()=>{ if(view>0){ view--; refresh(); } });
document.getElementById("nextBtn").addEventListener("click", ()=>{ if(view<TOP){ view++; refresh(); } });

/* ================= 렌더 ================= */
function refresh(){ renderHeader(); renderStats(); renderStage(); syncNav(); }

refresh();
</script>
