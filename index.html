<title>하루 한 조각 · 과학과 일본어</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ground: #E9EDE3;
    --paper: #F5F7EF;
    --ink: #1B322B;
    --ink-soft: #4A5D53;
    --accent: #1F7A4D;        /* 과학 = 에메랄드 */
    --accent-deep: #163B29;
    --clay: #B25534;          /* 일본어 = 클레이 */
    --clay-deep: #8A3F26;
    --line: rgba(27, 50, 43, 0.10);
    --grid: rgba(27, 50, 43, 0.045);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    --jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", var(--sans);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--ground);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 500px; margin: 0 auto; padding: 0 18px 52px; }

  header {
    background: var(--accent-deep);
    color: var(--paper);
    margin: 0 -18px;
    padding: 26px 22px 22px;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em;
    text-transform: uppercase; color: rgba(245,247,239,0.6);
    margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .eyebrow .day { color: var(--paper); font-size: 13px; letter-spacing: 0.14em; }
  header h1.brand { margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -0.01em; }
  header .date { font-family: var(--mono); font-size: 13px; color: rgba(245,247,239,0.68); margin-top: 6px; }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; margin: 18px 0 8px;
  }
  .stat { background: var(--paper); padding: 12px 8px 11px; text-align: center; }
  .stat .num { font-family: var(--mono); font-size: 21px; font-weight: 600; color: var(--accent); line-height: 1.1; }
  .stat .lab { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

  .seclabel {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-soft); margin: 28px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .seclabel::before { content: ""; width: 16px; height: 2px; background: currentColor; opacity: 0.5; }

  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 18px; padding: 24px 22px 22px;
  }
  .card.jp { border-color: rgba(178,85,52,0.28); }

  .tag {
    display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    color: var(--accent); background: rgba(31,122,77,0.10); border: 1px solid rgba(31,122,77,0.22);
    padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
  }
  .tag.clay { color: var(--clay-deep); background: rgba(178,85,52,0.10); border-color: rgba(178,85,52,0.26); }

  .fact-title { font-size: 22px; font-weight: 750; line-height: 1.35; margin: 0 0 14px; letter-spacing: -0.01em; }
  .fact-body p { font-size: 16px; color: #263a32; margin: 0 0 13px; }
  .fact-body p:last-child { margin-bottom: 0; }

  .think {
    margin-top: 18px; padding: 13px 15px; background: rgba(31,122,77,0.07);
    border-radius: 12px; font-size: 14.5px; color: #2c4a3c;
  }
  .think b { color: var(--accent); font-weight: 700; }

  .jp-word { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .jp-word .kanji { font-family: var(--jp); font-size: 40px; font-weight: 700; line-height: 1.1; }
  .jp-word .read { font-family: var(--jp); font-size: 16px; color: var(--clay-deep); }
  .jp-word .mean { font-size: 17px; color: var(--ink-soft); }

  .jp-block { margin-top: 18px; }
  .jp-block h4 {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--clay-deep); margin: 0 0 9px; font-weight: 600;
  }
  .hanja { font-size: 15px; color: #3a4a42; }
  .hanja .arrow { display: block; margin-top: 4px; color: var(--ink-soft); }

  .forms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .forms li { font-size: 14.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .forms .k { font-family: var(--jp); font-weight: 600; }
  .forms .r { font-family: var(--jp); font-size: 12.5px; color: var(--clay-deep); }
  .forms .m { color: var(--ink-soft); }
  .forms .role { font-size: 11px; color: var(--ink-soft); font-family: var(--mono); min-width: 62px; }

  .sents { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
  .sents li { position: relative; padding-left: 26px; }
  .sents li::before {
    counter-increment: s; content: counter(s); position: absolute; left: 0; top: 1px;
    font-family: var(--mono); font-size: 11px; color: #fff; background: var(--clay);
    width: 18px; height: 18px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  }
  .sents .jpt { font-family: var(--jp); font-size: 16px; font-weight: 500; display: block; }
  .sents .rdt { font-family: var(--jp); font-size: 13px; color: var(--clay-deep); display: block; margin-top: 2px; }
  .sents .kot { font-size: 14px; color: var(--ink-soft); display: block; margin-top: 3px; }

  .readbtn {
    margin-top: 20px; width: 100%; font-family: var(--sans); font-size: 15px; font-weight: 600;
    background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
    border-radius: 12px; padding: 12px; cursor: pointer; transition: background .15s, color .15s;
  }
  .readbtn:hover { background: rgba(31,122,77,0.08); }
  .readbtn.done { background: var(--accent); color: #fff; }
  .card.jp .readbtn { color: var(--clay-deep); border-color: var(--clay); }
  .card.jp .readbtn:hover { background: rgba(178,85,52,0.08); }
  .card.jp .readbtn.done { background: var(--clay); color: #fff; }

  .alldone { margin: 24px 0 0; text-align: center; font-size: 14.5px; color: var(--ink-soft); display: none; }
  .alldone.show { display: block; animation: rise .4s ease both; }
  .alldone b { color: var(--accent); }
  @keyframes rise { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce) { .alldone.show { animation: none; } .readbtn { transition: none; } }

  .empty {
    background: var(--paper); border: 1px dashed var(--line); border-radius: 18px;
    padding: 40px 24px; text-align: center; color: var(--ink-soft);
  }
  .testbar {
    margin-top: 28px; border-top: 1px dashed var(--line); padding-top: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .testbar .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); opacity: 0.7; }
  .testbar button { font-family: var(--mono); font-size: 12px; background: transparent; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .testbar button:hover { border-color: var(--accent); color: var(--accent); }
  .testbar button:disabled { opacity: 0.35; cursor: default; }
</style>

<div class="app">
  <header>
    <p class="eyebrow"><span>오늘의 한 조각</span><span class="day" id="dayLabel">DAY 001</span></p>
    <h1 class="brand">하루 한 조각</h1>
    <div class="date" id="dateLabel">—</div>
  </header>

  <section class="stats">
    <div class="stat"><div class="num" id="stStreak">0</div><div class="lab">연속일</div></div>
    <div class="stat"><div class="num" id="stSci">0</div><div class="lab">읽은 과학</div></div>
    <div class="stat"><div class="num" id="stJp">0</div><div class="lab">배운 단어</div></div>
  </section>

  <main id="stage"></main>
  <div class="alldone" id="allDone">오늘 몫을 다 읽었어요 · <b>내일 또 만나요</b></div>

  <div class="testbar">
    <span class="lbl">테스트용 · 다른 날 미리보기</span>
    <span>
      <button id="prevBtn">◀ 이전</button>
      <button id="nextBtn">다음 ▶</button>
    </span>
  </div>
</div>

<script>
/* ================= 콘텐츠 재고 ================= */
const SCI = [
  { field:"지구과학", title:"왜 눈송이는 육각형일까",
    body:[
      "눈송이가 육각형인 까닭은 물 분자의 생김새에 있다. 물 분자는 산소 하나에 수소 둘이 붙어 약 104.5도로 벌어진 모양인데, 물이 얼면 이 분자들이 수소 결합으로 이어지며 육각형 격자를 이룬다. 결정 전체가 이 육각 대칭을 따르기 때문에, 눈송이 가지도 늘 60도와 120도 방향으로만 뻗는다.",
      "눈송이는 떨어지는 동안 공기 중 수증기가 결정 표면에 곧장 얼어붙으며 자란다. 이때 어떤 모양이 될지는 지나온 온도와 습도에 따라 크게 갈린다. 영하 15도 부근에서는 별처럼 정교하게 갈라진 가지가 나오고, 온도가 달라지면 납작한 판이나 길쭉한 기둥이 된다.",
      "여섯 갈래가 서로 똑같이 생긴 이유는 단순하다. 여섯 팔이 바싹 붙어 있어 떨어지는 내내 같은 온도와 습도를 함께 겪는다. 같은 조건을 같은 순간에 지나니 여섯 방향이 나란히 자란다. 반대로 눈송이마다 떨어지는 길이 다르니, 두 개가 똑같을 확률은 사실상 없다.",
      "이 육각 얼음은 눈송이 밖에서도 모습을 드러낸다. 겨울 유리창에 돋는 성에가 같은 결정이고, 맑은 날 해 둘레에 뜨는 빛 고리(햇무리)도 여기서 나온다. 높은 구름 속 육각 얼음 알갱이가 프리즘처럼 햇빛을 꺾어, 해에서 정확히 22도 떨어진 자리에 고리를 그린다."
    ],
    think:"아주 추운 날 내린 눈이 잘 뭉쳐지지 않고 보송보송한 것도, 결정 모양과 관계가 있을까?" },

  { field:"생물", title:"문어는 왜 심장이 3개일까",
    body:[
      "문어는 심장이 셋이다. 둘은 아가미마다 붙어 아가미로 피를 밀어 넣는 아가미 심장이고, 하나는 산소를 실은 피를 온몸으로 보내는 중심 심장이다. 아가미에서 산소를 받아 중심 심장으로, 다시 온몸으로. 펌프질을 두 단계로 나눈 구조다.",
      "왜 이렇게 진화했을까. 문어의 피는 철(헤모글로빈)이 아니라 구리를 쓰는 헤모시아닌으로 산소를 나른다. 그래서 피가 붉지 않고 푸르스름하다. 헤모시아닌은 산소를 붙드는 힘이 헤모글로빈보다 약해서, 차갑고 산소가 적은 바닷속에서 온몸에 산소를 대려면 더 세게 펌프질해야 한다. 아가미 심장 둘이 그 부족분을 메운다.",
      "대신 약점도 있다. 물을 뿜어 빠르게 헤엄칠 때는 중심 심장이 잠깐 멈춰, 문어는 금세 지친다. 그래서 헤엄치기보다 팔로 기어다니기를 좋아한다.",
      "파란 피는 문어만의 것이 아니다. 게, 새우, 거미, 투구게처럼 차가운 물이나 오래된 계통의 동물이 헤모시아닌을 쓴다. 특히 투구게의 파란 피는 세균 오염을 예민하게 잡아내, 백신과 주사제의 안전성 검사에 실제로 쓰인다."
    ],
    think:"차가운 심해에 사는 동물일수록 붉은 피보다 파란 피가 유리한 이유는 무엇일까?" },

  { field:"물리", title:"하늘은 파란데 노을은 왜 붉을까",
    body:[
      "낮 하늘이 파란 까닭은 햇빛이 공기와 부딪히는 방식에 있다. 햇빛에는 여러 색이 섞여 있는데, 파장이 짧은 파란빛일수록 공기 분자에 부딪혀 사방으로 더 잘 흩어진다. 이 현상을 레일리 산란이라 한다. 흩어진 파란빛이 하늘 어느 쪽에서나 눈에 들어와 하늘이 온통 파랗다.",
      "산란의 세기는 파장이 짧을수록 급격히 커진다. 파란빛(약 450나노미터)은 빨간빛(약 650나노미터)보다 네다섯 배 강하게 흩어진다. 해질 무렵엔 햇빛이 대기를 더 비스듬하고 길게 지난다. 그동안 파란빛은 거의 다 흩어져 사라지고, 잘 흩어지지 않는 붉은빛만 남아 노을이 붉다.",
      "그런데 하늘은 왜 파란빛보다 파장이 더 짧은 보라색이 아닐까. 햇빛에 보라 성분이 적고, 사람 눈이 보라색에 덜 민감하기 때문이다. 두 가지가 겹쳐 하늘은 남색이 아니라 하늘색으로 보인다.",
      "같은 원리를 주변에서도 본다. 멀리 있는 산이 푸르스름한 것은 산과 우리 사이의 공기가 파란빛을 흩뿌린 결과다. 반대로 구름이 하얀 것은 물방울이 공기 분자보다 훨씬 커서 모든 색을 고르게 흩기 때문이다. 색이 다 섞이면 하얗게 보인다."
    ],
    think:"구름이 두꺼워지면 왜 하얗던 것이 회색이나 먹구름으로 어두워질까?" },

  { field:"물리 · 화학", title:"얼음은 왜 물에 뜰까",
    body:[
      "거의 모든 물질은 얼면 부피가 줄어 무거워진다. 물은 반대다. 얼면 부피가 약 9퍼센트 늘고 가벼워져, 얼음이 물에 뜬다.",
      "이유는 역시 물 분자의 수소 결합에 있다. 액체인 물은 분자들이 서로 가까이 붙어 자유롭게 미끄러진다. 그런데 얼면 수소 결합이 분자들을 육각형으로 성글게 붙들어 사이에 빈 공간이 생긴다. 그래서 같은 개수의 분자가 더 넓은 자리를 차지한다.",
      "이 사소해 보이는 성질이 생명을 살린다. 겨울에 호수가 얼 때 얼음이 위에 뜨기 때문에, 그 아래 물은 얼지 않고 남는다. 물고기와 미생물은 그 아래에서 겨울을 난다. 만약 얼음이 가라앉았다면 호수는 바닥부터 통째로 얼어붙었을 것이다.",
      "겨울에 물을 꽉 채운 병이나 수도관이 얼어 터지는 것도 같은 이유다. 늘어난 부피가 갈 곳이 없어 단단한 그릇마저 밀어낸다."
    ],
    think:"그렇다면 바닷물은 왜 민물보다 더 낮은 온도에서 어는 걸까?" },

  { field:"물리", title:"검은 자동차는 왜 더 뜨거워질까",
    body:[
      "여름 주차장에서 검은 차는 흰 차보다 훨씬 뜨겁다. 색이 빛을 다루는 방식이 다르기 때문이다.",
      "물체의 색은 그 물체가 어떤 빛을 되돌려 보내는지로 정해진다. 흰색은 들어온 빛을 거의 다 반사한다. 검은색은 반대로 대부분을 흡수한다. 흡수된 빛 에너지는 열로 바뀌므로, 검은 표면은 같은 햇빛을 받아도 더 많이 데워진다.",
      "그래서 더운 지방의 집과 옷은 흰색이 많고, 태양열을 모으는 장치는 검게 칠한다. 우주복이 흰 것도 햇빛을 되도록 반사해 안을 시원하게 지키기 위해서다.",
      "다만 흡수만 문제가 아니다. 검은 물체는 열을 잘 흡수하는 만큼 잘 내보내기도 한다. 그래서 해가 지면 검은 표면이 오히려 더 빨리 식는다. 잘 받아들이는 것은 잘 돌려주기도 한다."
    ],
    think:"사막의 유목민은 뜨거운 낮에 오히려 검은 옷을 입기도 한다. 흰옷이 늘 더 시원한 게 아니라면, 그 이유는 무엇일까?" },

  { field:"물리", title:"무지개는 왜 항상 그 자리에 뜰까",
    body:[

/* ================= 날짜 / 저장 ================= */
const START = new Date(2026, 6, 22); // 2026-07-22 = DAY 1
const KEY = "haru_v2";
const DAYS = Math.min(SCI.length, JP.length);

function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayIndex(){ return Math.floor((midnight(new Date()) - midnight(START)) / 86400000); }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {records:{}}; } catch(e){ return {records:{}}; } }
function save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }

let state = load();
const REAL = todayIndex();
let view = Math.min(Math.max(REAL, 0), DAYS - 1);

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================= 통계 ================= */
function renderStats(){
  const recs = state.records;
  let sci = 0, jp = 0;
  Object.keys(recs).forEach(k => { if(recs[k].sci) sci++; if(recs[k].jp) jp++; });
  let streak = 0;
  for (let i = REAL; i >= 0; i--){ if (recs[i] && recs[i].sci && recs[i].jp) streak++; else break; }
  document.getElementById("stStreak").textContent = streak;
  document.getElementById("stSci").textContent = sci;
  document.getElementById("stJp").textContent = jp;
}

/* ================= 렌더 ================= */
function renderHeader(){
  document.getElementById("dayLabel").textContent = "DAY " + String(view+1).padStart(3,"0");
  const d = new Date(midnight(START).getTime() + view*86400000);
  let label = d.toLocaleDateString("ko-KR", {month:"long", day:"numeric", weekday:"long"});
  if (view === REAL) label += " · 오늘";
  document.getElementById("dateLabel").textContent = label;
}

function sciCard(it, rec){
  let h = '<div class="seclabel" style="color:var(--accent)">오늘의 과학</div>';
  h += '<article class="card">';
  h += '<span class="tag">'+esc(it.field)+'</span>';
  h += '<h2 class="fact-title">'+esc(it.title)+'</h2>';
  h += '<div class="fact-body">'+ it.body.map(p=>'<p>'+esc(p)+'</p>').join('') +'</div>';
  h += '<div class="think"><b>🤔 생각해볼 거리</b><br>'+esc(it.think)+'</div>';
  h += '<button class="readbtn'+(rec&&rec.sci?' done':'')+'" data-kind="sci">'+(rec&&rec.sci?'✓ 읽음':'다 읽었어요')+'</button>';
  h += '</article>';
  return h;
}

function jpCard(it, rec){
  let h = '<div class="seclabel" style="color:var(--clay-deep)">오늘의 일본어</div>';
  h += '<article class="card jp">';
  h += '<span class="tag clay">'+esc(it.level)+'</span>';
  h += '<div class="jp-word"><span class="kanji">'+esc(it.word)+'</span><span class="read">'+esc(it.read)+'</span><span class="mean">'+esc(it.mean)+'</span></div>';
  h += '<div class="jp-block"><h4>한자 풀이</h4><div class="hanja">'+esc(it.hanja)+'<span class="arrow">→ '+esc(it.hanjaNote)+'</span></div></div>';
  h += '<div class="jp-block"><h4>품사 · 활용</h4><ul class="forms">';
  it.forms.forEach(f=>{ h += '<li><span class="role">'+esc(f.role)+'</span><span class="k">'+esc(f.k)+'</span><span class="r">'+esc(f.r)+'</span><span class="m">'+esc(f.m)+'</span></li>'; });
  h += '</ul></div>';
  h += '<div class="jp-block"><h4>일상 문장 5</h4><ul class="sents">';
  it.sents.forEach(s=>{ h += '<li><span class="jpt">'+esc(s.jp)+'</span><span class="rdt">'+esc(s.r)+'</span><span class="kot">'+esc(s.ko)+'</span></li>'; });
  h += '</ul></div>';
  h += '<button class="readbtn'+(rec&&rec.jp?' done':'')+'" data-kind="jp">'+(rec&&rec.jp?'✓ 배웠어요':'다 배웠어요')+'</button>';
  h += '</article>';
  return h;
}

function renderStage(){
  const stage = document.getElementById("stage");
  if (REAL >= DAYS && view === REAL){
    stage.innerHTML = '<div class="empty"><div style="font-size:26px;margin-bottom:8px;">🌱</div>준비된 조각을 모두 만났어요.<br>새 이야기가 채워지면 다시 찾아와 주세요.</div>';
    document.getElementById("allDone").classList.remove("show");
    return;
  }
  const rec = state.records[view];
  stage.innerHTML = sciCard(SCI[view], rec) + jpCard(JP[view], rec);
  stage.querySelectorAll(".readbtn").forEach(b=>{
    b.addEventListener("click", ()=> toggleRead(b.dataset.kind));
  });
  updateAllDone();
}

function toggleRead(kind){
  const r = state.records[view] || {sci:false, jp:false};
  r[kind] = !r[kind];
  state.records[view] = r;
  save(state);
  renderStage();
  renderStats();
}

function updateAllDone(){
  const r = state.records[view];
  const el = document.getElementById("allDone");
  if (r && r.sci && r.jp) el.classList.add("show"); else el.classList.remove("show");
}

/* ================= 내비 ================= */
function refresh(){ renderHeader(); renderStats(); renderStage(); syncNav(); }
function syncNav(){
  document.getElementById("prevBtn").disabled = view <= 0;
  document.getElementById("nextBtn").disabled = view >= DAYS - 1;
}
document.getElementById("prevBtn").addEventListener("click", ()=>{ if(view>0){ view--; refresh(); } });
document.getElementById("nextBtn").addEventListener("click", ()=>{ if(view<DAYS-1){ view++; refresh(); } });

refresh();
</script>
